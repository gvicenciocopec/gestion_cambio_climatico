<script>
/* =====================================================================
   VGestion · vistas de Gestión (SPEC §13.3, §14 v3.1: menos ruido en pantalla)
   - gestion.overview  #/gestion               Vista general (sólo administradores con «Ver como admin») + lista personal
   - gestion.pillar    #/gestion/:pilar        Proyectos del pilar (agrupados por Cascade) y sus tareas + lista personal
   - gestion.plan      #/gestion/:pilar/plan   Planificación: carta Gantt hecha a mano (sin librerías)
   Depende de FGestion (openProject, openProjectForm, openTask, openTaskForm, acción task.toggle),
   de TodoPanel (todoLayout, todoMount, todoParse) y de Core (pickDate, optimistic, isAdminUI).
   Todo con guardas typeof: si falta un módulo, la vista igual se dibuja.
   ===================================================================== */

/* ---------- Estado local y constantes ---------- */
// temps: altas rápidas aún sin confirmar {task, known:Set, at, realId}; siguen a la vista aunque llegue otra respuesta antes.
const VG = { route: null, timer: null, focusAdd: '', planScroll: null, temps: [] };
const VG_ESTADO_ORDEN = { 'Activo': 0, 'En pausa': 1, 'Cerrado': 2 };
// Brillo suave de las tarjetas de pilar (clases explícitas para Tailwind)
const VG_GLOW = {
  sky: 'from-sky-50/80 dark:from-sky-500/[0.06]',
  amber: 'from-amber-50/80 dark:from-amber-500/[0.06]',
  emerald: 'from-emerald-50/80 dark:from-emerald-500/[0.06]',
  violet: 'from-violet-50/80 dark:from-violet-500/[0.06]',
  indigo: 'from-indigo-50/80 dark:from-indigo-500/[0.06]',
  red: 'from-red-50/80 dark:from-red-500/[0.06]',
  zinc: 'from-zinc-50 dark:from-zinc-500/[0.06]',
};
// Barras de la carta Gantt por tono de pilar
const VG_BAR = {
  sky: { track: 'bg-sky-100 dark:bg-sky-500/15', fill: 'bg-sky-500/75 dark:bg-sky-400/60', line: 'border-sky-400/80 dark:border-sky-400/50', task: 'bg-sky-400/90 dark:bg-sky-400/70' },
  amber: { track: 'bg-amber-100 dark:bg-amber-500/15', fill: 'bg-amber-500/75 dark:bg-amber-400/60', line: 'border-amber-400/80 dark:border-amber-400/50', task: 'bg-amber-400/90 dark:bg-amber-400/70' },
  emerald: { track: 'bg-emerald-100 dark:bg-emerald-500/15', fill: 'bg-emerald-500/75 dark:bg-emerald-400/60', line: 'border-emerald-400/80 dark:border-emerald-400/50', task: 'bg-emerald-400/90 dark:bg-emerald-400/70' },
  violet: { track: 'bg-violet-100 dark:bg-violet-500/15', fill: 'bg-violet-500/75 dark:bg-violet-400/60', line: 'border-violet-400/80 dark:border-violet-400/50', task: 'bg-violet-400/90 dark:bg-violet-400/70' },
  indigo: { track: 'bg-indigo-100 dark:bg-indigo-500/15', fill: 'bg-indigo-500/75 dark:bg-indigo-400/60', line: 'border-indigo-400/80 dark:border-indigo-400/50', task: 'bg-indigo-400/90 dark:bg-indigo-400/70' },
  zinc: { track: 'bg-zinc-100 dark:bg-zinc-700/40', fill: 'bg-zinc-400/80 dark:bg-zinc-500/70', line: 'border-zinc-300 dark:border-zinc-600', task: 'bg-zinc-400/80 dark:bg-zinc-500/70' },
};
// Zoom de la planificación: px por día como ancho mínimo (en pantallas anchas la línea de tiempo se estira)
const VG_ZOOM = {
  mes: { label: 'Mes', ppd: 36 },
  trimestre: { label: 'Trimestre', ppd: 12 },
  anio: { label: 'Año', ppd: 3.2 },
};
const VG_LIM_ROWS = 4;        // tareas pendientes visibles por proyecto antes de «+N más»
const VG_LIM_DONE = 12;       // tareas listas visibles al desplegar «✓ N listas»
const VG_LIM_UPCOMING = 8;
const VG_LIM_TEAM = 8;
const VG_TEMP_TTL = 120000;   // red de seguridad: una alta rápida sin confirmar nunca queda como fantasma

function vgUi() {
  S.ui.gestion = S.ui.gestion || {};
  const u = S.ui.gestion;
  if (!u.pq) u.pq = {};              // búsqueda por pilar
  if (!u.mode) u.mode = {};          // 'proyectos' | 'indicadores' por pilar
  if (!u.more) u.more = {};          // proyectos con todas sus tareas pendientes a la vista
  if (!u.doneOpen) u.doneOpen = {};  // «✓ N listas» desplegado
  if (!u.casOpen) u.casOpen = {};
  if (u.addOpen == null) u.addOpen = '';
  if (!u.plan) u.plan = { zoom: LS.get('planZoom', 'trimestre'), open: {}, closed: false };
  return u;
}
// Anima la entrada sólo al llegar a la vista (no en cada filtro o guardado).
function vgAnim() { const a = VG.route !== S.route; VG.route = S.route; return a; }
function vgA(anim) { return anim ? 'anim-slide-up' : ''; }
function vgSoon() { clearTimeout(VG.timer); VG.timer = setTimeout(rerender, 150); }
function vgIsAdmin() { return typeof isAdminUI === 'function' ? isAdminUI() : !!(S && S.me && S.me.admin); }

/* ---------- Puentes defensivos hacia FGestion / TodoPanel / VPresupuesto ---------- */
function vgMissing() { toast('Este módulo aún no está disponible.', 'error'); }
function vgOpenProject(id) { if (typeof openProject === 'function') openProject(id); else vgMissing(); }
function vgOpenProjectForm(o) { if (typeof openProjectForm === 'function') openProjectForm(o || {}); else vgMissing(); }
function vgOpenTask(id) { if (typeof openTask === 'function') openTask(id); else vgMissing(); }
function vgOpenTaskForm(o) { if (typeof openTaskForm === 'function') openTaskForm(o || {}); else vgMissing(); }
// La lista personal (TodoPanel) envuelve la vista; sin ese módulo se muestra sólo el contenido principal.
function vgWrap(main) {
  const inner = '<div class="@container min-w-0">' + main + '</div>';
  if (typeof todoLayout === 'function') { try { return todoLayout(inner); } catch (e) { console.error(e); } }
  return inner;
}
function vgTodoMount(root) { if (typeof todoMount === 'function') { try { todoMount(root); } catch (e) { console.error(e); } } }

/* ---------- Datos ---------- */
function vgDone(t) { return t.estado === 'Realizada'; }
function vgKey(t) { return dueInfo(t).key; }
function vgIsSoon(t) { const k = vgKey(t); return k === 'today' || k === 'soon'; }
function vgPEstado(p) { return VG_ESTADO_ORDEN[p.estado] != null ? p.estado : 'Activo'; }
function vgTasksY() { return vgTasksAll().filter(t => taskInYear(t, S.year)); }
// Tareas del bundle + altas rápidas en vuelo (una respuesta anterior reemplaza S.tasks y no las trae aún).
function vgTasksAll() {
  const base = (S && S.tasks) || [];
  vgSettleTemps(base);
  if (!VG.temps.length) return base;
  const have = new Set(base.map(t => t.id));
  return base.concat(VG.temps.map(x => x.task).filter(t => !have.has(t.id)));
}
// Una alta rápida «aterriza» cuando llega su tarea real (por id, o una nueva con el mismo nombre y creador).
function vgSettleTemps(tasks) {
  if (!VG.temps.length) return;
  const now = Date.now(), used = new Set();
  VG.temps = VG.temps.filter(x => {
    if (now - x.at > VG_TEMP_TTL) return false;
    const real = x.realId ? tasks.find(t => t.id === x.realId)
      : tasks.find(t => !used.has(t.id) && !vgIsTmp(t) && !x.known.has(t.id) && normTxt(t.nombre) === normTxt(x.task.nombre) &&
        (!t.creadoPor || t.creadoPor === x.task.creadoPor));
    if (!real) return true;
    used.add(real.id);
    return false;
  });
}
// Proyectos del año: los de ese año o «Todos los años» (projectInYear) y, como las tareas pendientes,
// los de años anteriores que siguen abiertos (activos o en pausa) hasta que se cierran.
function vgProjInYear(p, year) {
  if (projectInYear(p, year)) return true;
  return p.estado !== 'Cerrado' && /^\d{4}$/.test(String(p.anio)) && Number(p.anio) < Number(year);
}
function vgByName(a, b) { return String(a.nombre || '').localeCompare(String(b.nombre || ''), 'es'); }
function vgByDue(a, b) {
  const fa = a.fecha || '9999-99-99', fb = b.fecha || '9999-99-99';
  return fa < fb ? -1 : fa > fb ? 1 : vgCmpAsc(a.creado, b.creado);
}
function vgCmpAsc(x, y) { x = String(x || ''); y = String(y || ''); return x === y ? 0 : x < y ? -1 : 1; }
function vgCmpDesc(x, y) { return vgCmpAsc(y, x); }
function vgDoneRef(t) { return t.completada || String(t.actualizado || '').slice(0, 10) || ''; }
function vgByDoneDesc(a, b) {
  const x = vgDoneRef(a), y = vgDoneRef(b);
  if (x !== y) return x < y ? 1 : -1;
  return vgCmpDesc(a.actualizado, b.actualizado);
}
function vgMatchQ(q, parts) {
  const words = normTxt(q).split(/\s+/).filter(Boolean);
  if (!words.length) return true;
  const hay = normTxt(parts.filter(Boolean).join(' '));
  return words.every(w => hay.indexOf(w) >= 0);
}
function vgIsTmp(t) { return !!t._tmp || /^tmp-/i.test(String(t.id || '')); }
// Fecha local 'yyyy-mm-dd' de un ISO (auditoría) o de una fecha ya en ese formato.
function vgDateOf(v) {
  const s = String(v || '');
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  if (!s) return '';
  const d = new Date(s);
  return isNaN(d.getTime()) ? '' : ymd(d);
}
function vgDays(a, b) { const x = parseYmd(a), y = parseYmd(b); return x && y ? Math.round((y - x) / 86400000) : 0; }
function vgMinD(a, b) { return !a ? b : !b ? a : a < b ? a : b; }
function vgMaxD(a, b) { return !a ? b : !b ? a : a > b ? a : b; }
function vgShortD(s) { return String(s).slice(0, 4) === String(new Date().getFullYear()) ? fmtDateShort(s) : fmtDate(s); }
function vgCap(s) { s = String(s || ''); return s.charAt(0).toUpperCase() + s.slice(1); }
// Grupo Cascade de un proyecto: el padre de su indicador, o el propio grupo si apunta a uno.
function vgGroupOf(p) {
  const c = p.cascade ? IDX.cascade.get(p.cascade) : null;
  if (!c) return { g: null, ord: -1 };
  if (!c.padre) return { g: c, ord: -1 };
  return { g: IDX.cascade.get(c.padre) || null, ord: Number(c.orden) || 0 };
}
// items: [{p, ...}] → [{id, label, sub, items}] en el orden del catálogo Cascade; «Otros proyectos» al final.
function vgGroupItems(pk, items) {
  const order = (IDX.cascadeGroups[pk] || []).map(g => g.id);
  const map = new Map();
  items.forEach(it => {
    const r = vgGroupOf(it.p);
    const gid = r.g ? r.g.id : '';
    if (!map.has(gid)) map.set(gid, { id: gid, label: r.g ? r.g.nombre : 'Otros proyectos', items: [] });
    it.ord = r.ord;
    map.get(gid).items.push(it);
  });
  const rank = id => { if (!id) return 1e9; const i = order.indexOf(id); return i < 0 ? 1e8 : i; };
  const out = Array.from(map.values()).sort((a, b) => (rank(a.id) - rank(b.id)) || String(a.label).localeCompare(String(b.label), 'es'));
  if (out.length === 1 && !out[0].id) out[0].label = 'Proyectos';
  out.forEach(G => G.items.sort((a, b) => (VG_ESTADO_ORDEN[vgPEstado(a.p)] - VG_ESTADO_ORDEN[vgPEstado(b.p)]) || (a.ord - b.ord) || vgByName(a.p, b.p)));
  return out;
}

/* ---------- Piezas de UI ---------- */
function vgPillarDot(key) {
  const P = PIL(key); if (!P) return '';
  return '<span class="inline-flex shrink-0 items-center gap-1"><span class="size-1.5 rounded-full ' + P.tone.dot + '"></span>' + esc(P.label) + '</span>';
}
function vgCardHead(o) {
  return '<div class="flex items-center gap-2.5 border-b border-zinc-100 px-4 py-3 dark:border-zinc-800">' +
    (o.icon ? '<span class="grid size-7 shrink-0 place-items-center rounded-lg ' + tone(o.tone || 'zinc').iconbox + '">' + icon(o.icon, 'size-4') + '</span>' : '') +
    '<h2 class="min-w-0 flex-1 truncate text-sm font-semibold text-zinc-900 dark:text-zinc-100">' + esc(o.title) + '</h2></div>';
}
// Barra de avance fina (el detalle va en el title y en aria).
function vgSlim(pc, solidCls, tip) {
  return '<div role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + pc + '" aria-label="' + esc(tip) + '" title="' + esc(tip) + '" class="h-1 w-full overflow-hidden rounded-full bg-zinc-100 dark:bg-zinc-800">' +
    '<div class="bar-grow h-full rounded-full ' + solidCls + '" style="width:' + Math.max(0, Math.min(100, pc || 0)) + '%"></div></div>';
}
// Estado vacío mínimo: ícono + una línea corta.
function vgEmpty(iconName, text, actionHtml) {
  return '<div class="flex flex-col items-center gap-3 px-4 py-8 text-center">' +
    '<p class="inline-flex items-center gap-2 text-sm text-zinc-500 dark:text-zinc-400">' + icon(iconName, 'size-4 shrink-0 text-zinc-400 dark:text-zinc-500') + esc(text) + '</p>' +
    (actionHtml ? '<div class="flex flex-wrap justify-center gap-2">' + actionHtml + '</div>' : '') + '</div>';
}
function vgChip(on, actionName, iconName, label, title, data) {
  return '<button type="button" data-action="' + esc(actionName) + '"' + dataAttrs(data) + ' aria-pressed="' + !!on + '" title="' + esc(title || label) + '" class="' + (on ? CX.chipOn : CX.chip) + '">' +
    icon(iconName, 'size-3.5') + esc(label) + '</button>';
}
// Fecha de vencimiento discreta: gris si queda tiempo, ámbar si es pronto, rojo suave sólo si está atrasada.
function vgDue(t) {
  if (!t.fecha || vgDone(t)) return '';
  const i = dueInfo(t);
  const cls = i.key === 'overdue' ? 'bg-red-50 text-red-700 dark:bg-red-500/10 dark:text-red-300'
    : (i.key === 'today' || i.key === 'soon') ? 'bg-amber-50 text-amber-700 dark:bg-amber-500/10 dark:text-amber-300'
      : 'text-zinc-500 dark:text-zinc-400';
  return '<span class="shrink-0 whitespace-nowrap rounded-md px-1.5 py-0.5 text-[11px] font-medium tabular-nums ' + cls + '" title="' + esc('Vence el ' + fmtDate(t.fecha)) + '">' + esc(i.label) + '</span>';
}
function vgCheck(t) {
  if (typeof checkButton === 'function') { try { return checkButton(t, { size: 'sm' }); } catch (e) { console.error(e); } }
  return '<button type="button" data-action="gestion.openTask" data-id="' + esc(t.id) + '" title="Abrir tarea" class="grid size-4 shrink-0 place-items-center">' +
    icon(vgDone(t) ? 'circle-check' : 'circle', 'size-4 ' + (vgDone(t) ? 'text-emerald-500' : 'text-zinc-400')) + '</button>';
}
// Fila compacta de tarea: check · título · candado si es privada · fecha suave · avatar.
function vgLine(t, o) {
  o = o || {};
  const done = vgDone(t);
  const tmp = vgIsTmp(t);
  const p = o.showProject && t.proyecto ? IDX.project.get(t.proyecto) : null;
  const sub = [];
  if (o.showPillar && PIL(t.pilar)) sub.push(vgPillarDot(t.pilar));
  if (p) sub.push('<span class="min-w-0 truncate">' + esc(p.nombre) + '</span>');
  const title = '<span class="task-title">' + esc(t.nombre || 'Tarea sin nombre') + '</span>';
  const titleCls = 'block w-full truncate rounded text-left text-[13px] leading-snug ' +
    (done ? 'text-zinc-400 line-through decoration-zinc-300 dark:text-zinc-500 dark:decoration-zinc-600' : 'text-zinc-800 dark:text-zinc-200');
  return '<div data-task-row data-id="' + esc(t.id) + '"' + (tmp ? ' aria-busy="true"' : ' data-action="gestion.openTask"') +
    ' class="group/tr flex min-w-0 items-center gap-2.5 rounded-lg px-2 py-1.5 transition-colors ' +
    (tmp ? 'opacity-60' : 'cursor-pointer hover:bg-zinc-100/70 dark:hover:bg-zinc-800/50') + '">' +
    (tmp ? '<span class="size-4 shrink-0 rounded-full border-2 border-dashed border-zinc-300 dark:border-zinc-600" aria-hidden="true"></span>' : vgCheck(t)) +
    '<div class="min-w-0 flex-1">' +
      (tmp ? '<span class="' + titleCls + '">' + title + '</span>'
        : '<button type="button" data-action="gestion.openTask" data-id="' + esc(t.id) + '" title="' + esc(t.nombre) + '" class="' + titleCls + ' focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500/60">' + title + '</button>') +
      (sub.length ? '<div class="mt-0.5 flex min-w-0 items-center gap-1.5 text-[11px] text-zinc-500 dark:text-zinc-400">' + sub.join('<span class="text-zinc-300 dark:text-zinc-600" aria-hidden="true">·</span>') + '</div>' : '') +
    '</div>' +
    (t.privada ? '<span class="shrink-0 text-zinc-400 dark:text-zinc-500" title="Privada: sólo la ven quien la creó y su responsable">' + icon('lock', 'size-3') + '<span class="sr-only">Privada</span></span>' : '') +
    (done ? (o.showDoneDate && t.completada ? '<span class="shrink-0 text-[11px] tabular-nums text-zinc-400 dark:text-zinc-500">' + esc(fmtDateShort(t.completada)) + '</span>' : '') : vgDue(t)) +
    (taskPeople(t).length ? avatarStack(taskPeople(t), 'xs', 2) : '') +
  '</div>';
}
function vgLines(list, o) {
  return '<div class="space-y-px p-1.5 sm:p-2">' + list.map(t => vgLine(t, o)).join('') + '</div>';
}
function vgNotFound() {
  return card(vgEmpty('compass', 'No encontramos este pilar'));
}

/* =====================================================================
   Vista general (administrador): sólo lo que ayuda a decidir —
   solicitudes por revisar, pendientes y atrasadas por pilar, lo que vence pronto y la carga de cada persona.
   ===================================================================== */
function vgOverview() {
  const anim = vgAnim();
  const u = vgUi();
  const tasksY = vgTasksY();
  const pending = tasksY.filter(t => !vgDone(t));

  const header = '<header class="mb-6 flex flex-wrap items-center justify-between gap-3">' +
    '<h1 class="min-w-0 truncate text-xl font-semibold tracking-tight text-zinc-900 sm:text-2xl dark:text-white">Vista general</h1>' +
    '<div class="flex shrink-0 items-center gap-2">' +
      btn({ label: 'Nuevo proyecto', icon: 'folder-plus', variant: 'ghost', action: 'gestion.newProject' }) +
      btn({ label: 'Nueva tarea', icon: 'plus', variant: 'primary', action: 'gestion.newTask' }) +
    '</div></header>';

  const pillars = '<div class="stagger grid grid-cols-1 gap-4 @2xl:grid-cols-3">' + S.pillars.map(p => vgPillarCard(p, tasksY, anim)).join('') + '</div>';

  // Lo que viene (todos los pilares): atrasadas + próximos 14 días
  const horizon = addDays(todayStr(), 14);
  const upcoming = pending.filter(t => t.fecha && t.fecha <= horizon).sort(vgByDue);
  const shown = u.upAll ? upcoming : upcoming.slice(0, VG_LIM_UPCOMING);
  const upcomingCard = card(vgCardHead({ icon: 'calendar-clock', tone: 'indigo', title: 'Lo que viene' }) + (upcoming.length
    ? vgLines(shown, { showPillar: true, showProject: true }) +
      (upcoming.length > VG_LIM_UPCOMING ? '<div class="border-t border-zinc-100 px-2 py-1.5 dark:border-zinc-800">' +
        btn({ label: u.upAll ? 'Mostrar menos' : 'Ver ' + (upcoming.length - VG_LIM_UPCOMING) + ' más', icon: u.upAll ? 'chevron-up' : 'chevron-down', variant: 'ghost', size: 'sm', action: 'gestion.upAll' }) + '</div>' : '')
    : vgEmpty('calendar-check', 'Nada vence en los próximos 14 días')),
  'overflow-hidden ' + vgA(anim));

  return vgWrap(header + vgSolicitudesCard(anim) + pillars +
    '<div class="mt-6 grid grid-cols-1 items-start gap-6 @4xl:grid-cols-[minmax(0,1fr)_20rem] @6xl:grid-cols-[minmax(0,1fr)_24rem]">' +
      '<div class="min-w-0">' + upcomingCard + '</div>' +
      '<div class="min-w-0">' + vgTeam(pending, anim) + '</div>' +
    '</div>');
}

// Tarjeta de pilar: pendientes, atrasadas y de esta semana; barra fina de avance del año.
function vgPillarCard(p, tasksY, anim) {
  const t = tone(p.color);
  const tasks = tasksY.filter(x => x.pilar === p.key);
  const pend = tasks.filter(x => !vgDone(x));
  const over = pend.filter(x => vgKey(x) === 'overdue').length;
  const week = pend.filter(vgIsSoon).length;
  const done = tasks.length - pend.length;
  const facts = [];
  if (over) facts.push('<span class="inline-flex items-center gap-1 font-medium text-red-600 dark:text-red-400">' + icon('clock-alert', 'size-3.5') + esc(plural(over, 'atrasada', 'atrasadas')) + '</span>');
  if (week) facts.push('<span class="inline-flex items-center gap-1 text-amber-700 dark:text-amber-300">' + icon('clock', 'size-3.5') + esc(week + ' esta semana') + '</span>');
  return '<a href="#/gestion/' + esc(p.key) + '" aria-label="' + esc('Abrir ' + p.label) + '" class="group flex min-w-0 flex-col gap-3 p-4 ' + CX.card + ' lift focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500/60 ' + vgA(anim) + '">' +
    '<div class="flex min-w-0 items-center gap-2.5">' +
      '<span class="grid size-8 shrink-0 place-items-center rounded-lg ' + t.iconbox + '">' + icon(p.icon, 'size-4') + '</span>' +
      '<h3 class="min-w-0 flex-1 truncate text-[15px] font-semibold tracking-tight text-zinc-900 dark:text-white">' + esc(p.label) + '</h3>' +
      icon('chevron-right', 'size-4 shrink-0 text-zinc-300 transition group-hover:translate-x-0.5 group-hover:text-zinc-500 dark:text-zinc-600 dark:group-hover:text-zinc-400') +
    '</div>' +
    '<div>' +
      '<p class="flex items-baseline gap-1.5"><span class="text-2xl font-semibold tabular-nums tracking-tight text-zinc-900 dark:text-white">' + pend.length + '</span>' +
        '<span class="text-xs text-zinc-500 dark:text-zinc-400">' + (pend.length === 1 ? 'pendiente' : 'pendientes') + '</span></p>' +
      (facts.length ? '<p class="mt-1 flex flex-wrap items-center gap-x-3 gap-y-1 text-xs">' + facts.join('') + '</p>' : '') +
    '</div>' +
    (tasks.length ? vgSlim(pct(done, tasks.length), t.solid, done + ' de ' + tasks.length + ' tareas listas en ' + S.year) : '') +
  '</a>';
}

// Franja (sólo administrador y sólo si hay algo por revisar): solicitudes de compra de Ariba.

// Carga del equipo: pendientes por persona (rojo = atrasadas, ámbar = esta semana); toca para ver el detalle.
function vgTeam(pending, anim) {
  const u = vgUi();
  const rows = S.users.map(x => ({ email: x.email, name: x.name }));
  const extra = {};
  pending.forEach(t => taskPeople(t).forEach(e => { if (!S.users.some(x => x.email === e)) extra[e] = 1; }));
  Object.keys(extra).forEach(e => rows.push({ email: e, name: userName(e) }));
  if (pending.some(t => !t.resp)) rows.push({ email: '', name: 'Sin asignar' });
  rows.forEach(r => {
    // v3.6 (SPEC §20): una tarea con varias personas cuenta para cada una
    r.list = pending.filter(t => r.email ? taskPeople(t).indexOf(r.email) >= 0 : !t.resp).sort(vgByDue);
    r.total = r.list.length;
    r.ov = r.list.filter(t => vgKey(t) === 'overdue').length;
    r.so = r.list.filter(vgIsSoon).length;
    r.rest = r.total - r.ov - r.so;
  });
  const max = Math.max(1, ...rows.map(r => r.total));
  const seg = (n, tot, cls) => n ? '<div class="h-full ' + cls + '" style="width:' + (n / tot * 100).toFixed(2) + '%"></div>' : '';

  const items = rows.map(r => {
    const key = r.email || '__none';
    const open = u.teamOpen === key;
    const tip = plural(r.total, 'pendiente', 'pendientes') + (r.ov ? ' · ' + plural(r.ov, 'atrasada', 'atrasadas') : '') + (r.so ? ' · ' + r.so + ' esta semana' : '');
    const bar = '<div class="mt-1.5 h-1 w-full overflow-hidden rounded-full bg-zinc-100 dark:bg-zinc-800" title="' + esc(tip) + '">' +
      (r.total ? '<div class="bar-grow flex h-full overflow-hidden rounded-full" style="width:' + (r.total / max * 100).toFixed(1) + '%">' +
        seg(r.ov, r.total, 'bg-red-400 dark:bg-red-400/80') + seg(r.so, r.total, 'bg-amber-300 dark:bg-amber-400/70') + seg(r.rest, r.total, 'bg-indigo-300 dark:bg-indigo-400/60') + '</div>' : '') + '</div>';
    const expanded = open ? '<div class="mb-2 mt-1 overflow-hidden rounded-lg border border-zinc-200 anim-fade-in dark:border-zinc-800">' +
      (r.total ? vgLines(r.list.slice(0, VG_LIM_TEAM), { showPillar: true, showProject: true }) : vgEmpty('check', 'Sin pendientes')) +
      (r.total > VG_LIM_TEAM ? '<p class="border-t border-zinc-100 px-3 py-1.5 text-xs text-zinc-500 dark:border-zinc-800 dark:text-zinc-400">' + esc('+' + (r.total - VG_LIM_TEAM) + ' más') + '</p>' : '') +
      '</div>' : '';
    return '<li>' +
      '<button type="button" data-action="gestion.team" data-email="' + esc(key) + '" aria-expanded="' + open + '" title="' + esc((open ? 'Ocultar' : 'Ver') + ' tareas de ' + r.name) + '" class="flex w-full items-center gap-3 rounded-lg px-2 py-2 text-left transition hover:bg-zinc-50 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500/60 dark:hover:bg-zinc-800/50">' +
        avatar(r.email, 'md') +
        '<div class="min-w-0 flex-1">' +
          '<div class="flex items-center justify-between gap-2">' +
            '<span class="truncate text-sm font-medium text-zinc-900 dark:text-zinc-100">' + esc(r.name) + '</span>' +
            '<span class="flex shrink-0 items-center gap-1.5 text-xs tabular-nums">' +
              (r.ov ? '<span class="font-medium text-red-600 dark:text-red-400">' + esc(plural(r.ov, 'atrasada', 'atrasadas')) + '</span><span class="text-zinc-300 dark:text-zinc-600" aria-hidden="true">·</span>' : '') +
              '<span class="font-semibold text-zinc-800 dark:text-zinc-100" title="' + esc(plural(r.total, 'pendiente', 'pendientes')) + '">' + r.total + '</span>' +
              icon(open ? 'chevron-up' : 'chevron-down', 'size-3.5 text-zinc-400') +
            '</span>' +
          '</div>' + bar +
        '</div>' +
      '</button>' + expanded + '</li>';
  }).join('');

  return card(vgCardHead({ icon: 'users-round', tone: 'violet', title: 'Cómo va el equipo' }) +
    (pending.length ? '<ul class="space-y-0.5 p-2">' + items + '</ul>' : vgEmpty('check', 'Sin pendientes')),
  'overflow-hidden ' + vgA(anim));
}

/* =====================================================================
   Página de pilar: proyectos (agrupados por Cascade) con sus tareas a la vista
   ===================================================================== */
function vgPillar(params) {
  const anim = vgAnim();
  const P = PIL(params.pilar);
  if (!P) return vgNotFound();
  const u = vgUi();
  const mode = u.mode[P.key] === 'indicadores' ? 'indicadores' : 'proyectos';
  const D = vgPillarData(P.key);
  const body = mode === 'indicadores' ? vgCascadeTab(P, anim) : vgPillarBody(P, D, anim);
  return vgWrap(vgPillarHeader(P) + vgPillarTools(P, mode) + body);
}

// Proyectos y tareas visibles del pilar, ya filtrados (búsqueda y «Sólo lo mío»).
function vgPillarData(pk) {
  const u = vgUi();
  const me = myEmail();
  const mine = !!u.mineOnly && !!me;
  const q = String(u.pq[pk] || '').trim();
  const tasks = vgTasksY().filter(t => t.pilar === pk);
  const byProj = new Map();
  tasks.forEach(t => {
    const k = t.proyecto && IDX.project.has(t.proyecto) ? t.proyecto : '';
    if (!byProj.has(k)) byProj.set(k, []);
    byProj.get(k).push(t);
  });
  const taskHit = t => vgMatchQ(q, [t.nombre, t.detalle].concat(taskPeople(t).map(userName)));
  // Un proyecto propio muestra todas sus tareas; los demás, sólo las mías (con «Sólo lo mío»).
  const pick = (p, all) => {
    const own = !!p && p.resp === me;
    const projHit = p ? vgMatchQ(q, [p.nombre, p.detalle, p.resp && userName(p.resp), p.cascade && cascadeLabel(p.cascade)]) : !q;
    let l = all;
    if (mine && !own) l = l.filter(isMine);
    if (q && !projHit) l = l.filter(taskHit);
    const show = (!mine || own || l.length > 0) && (!q || projHit || l.length > 0);
    return { show: show, pend: l.filter(t => !vgDone(t)).sort(vgByDue), done: l.filter(vgDone).sort(vgByDoneDesc) };
  };
  const projs = (S.projects || []).filter(p => p.pilar === pk && vgProjInYear(p, S.year));
  const open = [], closed = [];
  projs.forEach(p => {
    const all = byProj.get(p.id) || [];
    const r = pick(p, all);
    if (!r.show) return;
    const it = { p: p, pend: r.pend, done: r.done, total: all.length, doneAll: all.filter(vgDone).length };
    // Un proyecto cerrado que aún tiene tareas pendientes sigue a la vista (para que no se pierdan)
    (vgPEstado(p) === 'Cerrado' && !r.pend.length ? closed : open).push(it);
  });
  const loose = pick(null, byProj.get('') || []);
  return {
    pk: pk, q: q, mine: mine,
    groups: vgGroupItems(pk, open),
    closed: closed.sort((a, b) => vgByName(a.p, b.p)),
    loose: loose,
    nProjects: projs.length,
    nLoose: (byProj.get('') || []).length,
  };
}

function vgPillarHeader(P) {
  return '<header class="mb-5 flex flex-wrap items-center justify-between gap-3">' +
    '<div class="flex min-w-0 items-center gap-3">' +
      '<span class="grid size-10 shrink-0 place-items-center rounded-xl ring-1 ring-inset ring-black/5 dark:ring-white/5 ' + P.tone.iconbox + '">' + icon(P.icon, 'size-5') + '</span>' +
      '<h1 class="min-w-0 truncate text-xl font-semibold tracking-tight text-zinc-900 sm:text-2xl dark:text-white">' + esc(P.label) + '</h1>' +
      '<a href="#/gestion/' + esc(P.key) + '/plan" title="Carta Gantt del pilar" class="inline-flex shrink-0 items-center gap-1 rounded text-xs font-medium text-zinc-500 underline-offset-4 transition-colors hover:text-zinc-800 hover:underline focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500/60 dark:text-zinc-400 dark:hover:text-zinc-100">' +
        icon('chart-gantt', 'size-3.5') + 'Planificación</a>' +
    '</div>' +
    '<div class="flex shrink-0 items-center gap-2">' +
      btn({ label: 'Nuevo proyecto', icon: 'folder-plus', variant: 'ghost', action: 'gestion.newProject', data: { pilar: P.key } }) +
      btn({ label: 'Nueva tarea', icon: 'plus', variant: 'primary', action: 'gestion.newTask', data: { pilar: P.key } }) +
    '</div></header>';
}

function vgPillarTools(P, mode) {
  const u = vgUi();
  const q = u.pq[P.key] || '';
  const filters = mode === 'proyectos'
    ? searchInput({ id: 'q-vg-' + P.key, input: 'gestion.q', value: q, placeholder: 'Buscar proyecto o tarea…', cls: 'w-full sm:w-64',
        attrs: 'data-pilar="' + esc(P.key) + '" aria-label="' + esc('Buscar en ' + P.label) + '"' }) +
      (myEmail() ? vgChip(u.mineOnly, 'gestion.mineOnly', 'user-round', 'Sólo lo mío', 'Mis proyectos y mis tareas') : '') +
      (q || u.mineOnly ? btn({ label: 'Limpiar', icon: 'x', variant: 'ghost', size: 'sm', action: 'gestion.clear', data: { pilar: P.key } }) : '')
    : '';
  return '<div class="mb-6 flex flex-wrap items-center gap-2">' + filters +
    '<div class="ml-auto">' + segmented({ action: 'gestion.mode', value: mode, data: { pilar: P.key }, options: [
      { value: 'proyectos', label: 'Proyectos', icon: 'folder-kanban' },
      { value: 'indicadores', label: 'Indicadores', icon: 'target' },
    ] }) + '</div></div>';
}

function vgPillarBody(P, D, anim) {
  const u = vgUi();
  const sections = D.groups.map(G => vgGroupSection(G, P, anim)).join('');
  const loose = vgLooseSection(P, D.loose, anim);
  const shown = D.groups.reduce((a, G) => a + G.items.length, 0);
  if (!D.nProjects && !D.nLoose) return card(vgEmpty(P.icon, 'Sin proyectos aún'), vgA(anim));
  let closed = '';
  if (D.closed.length) {
    closed = '<section class="' + vgA(anim) + '">' +
      '<button type="button" data-action="gestion.showClosed" aria-expanded="' + !!u.showClosed + '" class="inline-flex items-center gap-1.5 rounded-md px-1 py-0.5 text-xs font-medium text-zinc-500 transition-colors hover:text-zinc-800 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500/60 dark:text-zinc-400 dark:hover:text-zinc-100">' +
        icon('archive', 'size-3.5') + (u.showClosed ? 'Ocultar cerrados' : 'Ver cerrados') + '<span class="tabular-nums text-zinc-400 dark:text-zinc-500">(' + D.closed.length + ')</span>' +
        icon(u.showClosed ? 'chevron-up' : 'chevron-down', 'size-3 opacity-60') + '</button>' +
      (u.showClosed ? '<div class="mt-3 grid grid-cols-1 gap-2 anim-fade-in @xl:grid-cols-2 @5xl:grid-cols-3">' + D.closed.map(it => vgProjChip(it, P)).join('') + '</div>' : '') +
    '</section>';
  }
  if (!shown && !loose) {
    const filtered = D.q || D.mine;
    return card(filtered ? vgEmpty('search', 'Nada por aquí con ese filtro') : vgEmpty('archive', 'Todos los proyectos están cerrados'), vgA(anim)) +
      (closed ? '<div class="mt-6">' + closed + '</div>' : '');
  }
  return '<div class="space-y-8">' + sections + loose + closed + '</div>';
}

// Sección de un grupo Cascade: sólo su nombre (sin etiqueta «Iniciativa» ni conteos).
function vgGroupSection(G, P, anim) {
  const u = vgUi();
  const full = G.items.filter(it => it.pend.length || it.done.length || u.addOpen === it.p.id);
  const compact = G.items.filter(it => full.indexOf(it) < 0);
  return '<section class="' + vgA(anim) + '">' +
    '<h2 class="mb-3 truncate px-0.5 text-[11px] font-semibold uppercase tracking-wider text-zinc-500 dark:text-zinc-400" title="' + esc(G.label) + '">' + esc(G.label) + '</h2>' +
    (full.length ? '<div class="grid grid-cols-1 items-start gap-3 @2xl:grid-cols-2 @6xl:grid-cols-3">' + full.map(it => vgProjCard(it, P)).join('') + '</div>' : '') +
    (compact.length ? '<div class="' + (full.length ? 'mt-3 ' : '') + 'grid grid-cols-1 gap-2 @xl:grid-cols-2 @5xl:grid-cols-3">' + compact.map(it => vgProjChip(it, P)).join('') + '</div>' : '') +
  '</section>';
}

function vgProjDates(p) {
  const a = p.inicio || '', b = p.fin || '';
  if (a && b) return vgShortD(a) + ' – ' + vgShortD(b);
  if (b) return 'hasta ' + vgShortD(b);
  if (a) return 'desde ' + vgShortD(a);
  return '';
}

// Tarjeta compacta: nombre, avatar, barra fina de avance y hasta 4 tareas pendientes.
// Fechas y estado sólo si aportan (fechas definidas, proyecto en pausa o cerrado).
function vgProjCard(it, P) {
  const u = vgUi();
  const p = it.p;
  const est = vgPEstado(p);
  const more = !!u.more[p.id];
  const shown = more ? it.pend : it.pend.slice(0, VG_LIM_ROWS);
  const rest = it.pend.length - shown.length;
  const dates = vgProjDates(p);
  const meta = [];
  if (dates) meta.push('<span class="inline-flex items-center gap-1 whitespace-nowrap">' + icon('calendar', 'size-3 text-zinc-400') + esc(dates) + '</span>');
  if (est !== 'Activo') meta.push('<span class="inline-flex items-center gap-1">' + icon(est === 'Cerrado' ? 'archive' : 'circle-pause', 'size-3') + esc(est) + '</span>');
  // v3.6 (SPEC §20): destino al soltar una tarea arrastrada desde «Mis tareas» (no en proyectos cerrados)
  return '<article class="min-w-0 ' + CX.card + '" data-vg-project="' + esc(p.id) + '"' + (est !== 'Cerrado' ? ' data-drop-project="' + esc(p.id) + '"' : '') + '>' +
    '<header class="flex items-start gap-3 px-4 pb-2 pt-3.5">' +
      '<div class="min-w-0 flex-1">' +
        '<button type="button" data-action="gestion.openProject" data-id="' + esc(p.id) + '" title="' + esc('Abrir proyecto: ' + p.nombre) + '" class="line-clamp-2 rounded text-left text-sm font-semibold leading-snug text-zinc-900 transition-colors hover:text-indigo-600 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500/60 dark:text-zinc-100 dark:hover:text-indigo-400">' + esc(p.nombre) + '</button>' +
        (meta.length ? '<div class="mt-1 flex flex-wrap items-center gap-x-3 gap-y-1 text-[11px] text-zinc-500 dark:text-zinc-400">' + meta.join('') + '</div>' : '') +
      '</div>' +
      (p.resp ? avatar(p.resp, 'sm') : '') +
    '</header>' +
    (it.total ? '<div class="px-4 pb-1.5">' + vgSlim(pct(it.doneAll, it.total), P.tone.solid, it.doneAll + ' de ' + it.total + ' tareas listas') + '</div>' : '') +
    '<div class="px-2 pb-2">' +
      shown.map(t => vgLine(t)).join('') +
      (rest > 0 || (more && it.pend.length > VG_LIM_ROWS)
        ? '<button type="button" data-action="gestion.more" data-key="' + esc(p.id) + '" class="ml-8 rounded px-1 py-0.5 text-xs font-medium text-zinc-500 transition-colors hover:text-zinc-800 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500/60 dark:text-zinc-400 dark:hover:text-zinc-100">' +
          (rest > 0 ? '+' + rest + ' más' : 'Mostrar menos') + '</button>'
        : '') +
      (est !== 'Cerrado' ? vgAddRow(p.id) : '') +
      vgDoneLine(p.id, it.done) +
    '</div>' +
  '</article>';
}

// Proyecto sin tareas (o cerrado): una línea compacta.

  const est = vgPEstado(p);
  return '<div' + (est !== 'Cerrado' ? ' data-drop-project="' + esc(p.id) + '"' : '') + ' class="group flex min-w-0 items-center gap-2.5 rounded-lg border border-zinc-200/80 bg-white px-3 py-2 transition-colors hover:border-zinc-300 dark:border-zinc-800 dark:bg-zinc-900 dark:hover:border-zinc-700' + (est === 'Cerrado' ? ' opacity-75' : '') + '">' +

    '<button type="button" data-action="gestion.openProject" data-id="' + esc(p.id) + '" title="' + esc(p.nombre) + '" class="min-w-0 flex-1 truncate rounded text-left text-[13px] text-zinc-700 transition-colors hover:text-zinc-950 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500/60 dark:text-zinc-300 dark:hover:text-white">' + esc(p.nombre) + '</button>' +
    (est !== 'Activo' ? '<span class="shrink-0 text-[11px] text-zinc-400 dark:text-zinc-500">' + esc(est) + '</span>' : '') +
    (p.resp ? avatar(p.resp, 'xs') : '') +
    (est !== 'Cerrado'
      ? '<button type="button" data-action="gestion.addOpen" data-key="' + esc(p.id) + '" title="Agregar una tarea a este proyecto" aria-label="' + esc('Agregar tarea a ' + p.nombre) + '" class="grid size-6 shrink-0 place-items-center rounded-md text-zinc-400 transition hover:bg-zinc-100 hover:text-indigo-600 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500/60 pointer-fine:opacity-0 pointer-fine:group-hover:opacity-100 pointer-fine:focus-visible:opacity-100 dark:hover:bg-zinc-800 dark:hover:text-indigo-400">' + icon('plus', 'size-3.5') + '</button>'

// «✓ 5 listas»: las tareas realizadas quedan abajo, plegadas.
function vgDoneLine(key, done) {
  if (!done.length) return '';
  const open = !!vgUi().doneOpen[key];
  return '<div class="mt-1 border-t border-zinc-100 pt-1 dark:border-zinc-800/80">' +

/* ---------- Modo «Indicadores»: catálogo Cascade del pilar con sus tareas ---------- */

function vgCascadeTab(p, anim) {

  const blocks = groups.map(g => {

      '<span class="grid size-7 shrink-0 place-items-center rounded-lg bg-zinc-100 text-zinc-500 dark:bg-zinc-800 dark:text-zinc-400">' + icon(CLASE_META.grupo.icon, 'size-4') + '</span>' +

      const open = !!u.casOpen[k.id] && c.list.length > 0;
      const label = '<span class="grid size-6 shrink-0 place-items-center rounded-md ' + tone(meta.tone).iconbox + '" title="' + esc(meta.label) + '">' + icon(meta.icon, 'size-3.5') + '<span class="sr-only">' + esc(meta.label) + '</span></span>' +
        '<span class="line-clamp-2 min-w-0 flex-1 text-sm text-zinc-800 dark:text-zinc-200">' + esc(k.nombre) + '</span>';
      const main = c.list.length
        ? '<button type="button" data-action="gestion.casToggle" data-id="' + esc(k.id) + '" aria-expanded="' + open + '" title="' + esc((open ? 'Ocultar' : 'Ver') + ' tareas vinculadas') + '" class="group flex min-w-0 flex-1 items-center gap-2.5 rounded-md text-left focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500/60">' +
          label + icon(open ? 'chevron-up' : 'chevron-down', 'size-3.5 shrink-0 text-zinc-400 group-hover:text-zinc-600 dark:group-hover:text-zinc-300') + '</button>'
        : '<div class="flex min-w-0 flex-1 items-center gap-2.5">' + label + '</div>';
      const tasksHtml = open
        ? '<div class="border-t border-zinc-100 bg-zinc-50/60 anim-fade-in dark:border-zinc-800 dark:bg-zinc-950/30">' +
          vgLines(c.list.slice().sort((a, b) => (vgDone(a) - vgDone(b)) || (vgDone(a) ? vgByDoneDesc(a, b) : vgByDue(a, b))), { showProject: true, showDoneDate: true }) + '</div>'

      return '<li>' +

  return intro + '<div class="stagger space-y-4">' + blocks + '</div>';

function vgPillarMount(root) {

/* =====================================================================
   Planificación: carta Gantt del pilar (proyectos → tareas) hecha con posiciones absolutas en %.
   La columna de nombres es sticky; la línea de tiempo se desplaza horizontalmente y parte en «Hoy».
   ===================================================================== */
// Tramo de una tarea: desde su creación hasta su vencimiento (o el día en que quedó lista). Sin fecha → punto.
function vgTaskSpan(t) {
  const c = vgDateOf(t.creado);
  const end = vgDone(t) ? (t.completada || t.fecha || '') : (t.fecha || '');
  if (!end) return { s: c, e: c, dot: true };
  const s = c && c < end ? c : end;
  return { s: s, e: end, dot: false };
}
function vgBySpan(a, b) {
  const x = vgTaskSpan(a), y = vgTaskSpan(b);
  return vgCmpAsc(x.s, y.s) || vgCmpAsc(x.e, y.e) || vgByName(a, b);
}
function vgPlanProject(p, all) {
  const spans = all.map(vgTaskSpan).filter(x => x.s);
  let s = p.inicio || spans.reduce((m, x) => vgMinD(m, x.s), '');
  let e = p.fin || spans.reduce((m, x) => vgMaxD(m, x.e), '');
  // Sin fechas ni tareas: no se inventa una barra (se muestra «Sin fechas aún»).
  const dot = !s && !e;
  if (!s) s = e;
  if (!e) e = s;
  if (e < s) { const x = s; s = e; e = x; }
  const done = all.filter(vgDone).length;
  return { type: 'project', p: p, s: s, e: e, dot: dot, est: !(p.inicio && p.fin), done: done, total: all.length, pct: pct(done, all.length) };
}
function vgPlanTask(t, nested) {
  const sp = vgTaskSpan(t);
  const state = vgDone(t) ? 'done' : vgKey(t) === 'overdue' ? 'overdue' : 'pending';
  return { type: 'task', t: t, s: sp.s, e: sp.e, dot: sp.dot, state: state, nested: nested };
}
function vgPlanData(P) {
  const u = vgUi();
  const me = myEmail();
  const mine = !!u.mineOnly && !!me;
  const open = u.plan.open;
  const tasks = vgTasksY().filter(t => t.pilar === P.key && !vgIsTmp(t));
  const byProj = new Map();
  tasks.forEach(t => {
    const k = t.proyecto && IDX.project.has(t.proyecto) ? t.proyecto : '';
    if (!byProj.has(k)) byProj.set(k, []);
    byProj.get(k).push(t);
  });
  const items = [];
  (S.projects || []).filter(p => p.pilar === P.key && vgProjInYear(p, S.year) && (u.plan.closed || vgPEstado(p) !== 'Cerrado')).forEach(p => {
    const all = byProj.get(p.id) || [];
    let list = all;
    if (mine && p.resp !== me) { list = all.filter(isMine); if (!list.length) return; }
    items.push({ p: p, all: all, list: list });
  });
  const rows = [];
  const ext = [];   // todos los tramos (también los de tareas plegadas): el rango no salta al desplegar
  vgGroupItems(P.key, items).forEach(G => {
    rows.push({ type: 'group', label: G.label });
    G.items.forEach(it => {
      const pr = vgPlanProject(it.p, it.all);
      pr.open = !!open[it.p.id] && it.list.length > 0;
      pr.nList = it.list.length;
      rows.push(pr);
      ext.push(pr);
      const trs = it.list.slice().sort(vgBySpan).map(t => vgPlanTask(t, true));
      trs.forEach(tr => ext.push(tr));
      if (pr.open) trs.forEach(tr => rows.push(tr));
    });
  });
  let loose = byProj.get('') || [];
  if (mine) loose = loose.filter(isMine);
  if (loose.length) {
    rows.push({ type: 'group', label: 'Tareas sin proyecto' });
    loose.slice().sort(vgBySpan).forEach(t => { const tr = vgPlanTask(t, false); rows.push(tr); ext.push(tr); });
  }
  const withTasks = items.filter(it => it.list.length);
  return { rows: rows, ext: ext, ids: withTasks.map(it => it.p.id), allOpen: withTasks.length > 0 && withTasks.every(it => open[it.p.id]) };
}
// Rango visible: incluye hoy y todos los tramos, con margen; completa meses enteros.
function vgPlanRange(rows, zoom) {
  const t0 = todayStr();
  let a = t0, b = t0;
  rows.forEach(r => { if (r.s) a = vgMinD(a, r.s); if (r.e) b = vgMaxD(b, r.e); });
  if (zoom === 'anio') { a = vgMinD(a, S.year + '-01-01'); b = vgMaxD(b, S.year + '-12-31'); }
  a = addDays(a, -10);
  b = addDays(b, 21);
  const minSpan = { mes: 90, trimestre: 240, anio: 365 }[zoom] || 120;
  if (vgDays(a, b) < minSpan) b = addDays(a, minSpan);
  // Tope de 5 años alrededor de hoy (datos con fechas muy lejanas no estiran la vista sin fin)
  if (vgDays(a, b) > 1830) { a = vgMaxD(a, addDays(t0, -730)); b = vgMinD(b, addDays(t0, 1095)); }
  a = a.slice(0, 7) + '-01';
  const bd = parseYmd(b);
  b = ymd(new Date(bd.getFullYear(), bd.getMonth() + 1, 0));
  return { a: a, b: b, days: vgDays(a, b) + 1 };
}

function vgPlan(params) {
  const anim = vgAnim();
  const P = PIL(params.pilar);
  if (!P) return vgNotFound();
  const u = vgUi();
  const zoom = VG_ZOOM[u.plan.zoom] ? u.plan.zoom : 'trimestre';
  const data = vgPlanData(P);
  const head = vgPlanHeader(P, data, zoom);
  if (!data.rows.length) {
    const filtered = !!u.mineOnly && !!myEmail();
    return head + card(filtered
      ? vgEmpty('user-round', 'Nada tuyo por planificar aquí', btn({ label: 'Ver todo', icon: 'x', variant: 'secondary', size: 'sm', action: 'gestion.mineOnly' }))
      : vgEmpty('chart-gantt', 'Nada que planificar todavía'), vgA(anim));
  }
  return head + vgGantt(P, data.rows, vgPlanRange(data.ext, zoom), zoom, anim) + vgPlanLegend(P);
}

function vgPlanHeader(P, data, zoom) {
  const u = vgUi();
  return '<div class="mb-5">' +
    '<a href="#/gestion/' + esc(P.key) + '" class="mb-3 inline-flex items-center gap-1 rounded text-xs font-medium text-zinc-500 transition-colors hover:text-zinc-900 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500/60 dark:text-zinc-400 dark:hover:text-white">' +
      icon('arrow-left', 'size-3.5') + esc(P.label) + '</a>' +
    '<div class="flex flex-col gap-4 lg:flex-row lg:items-center lg:justify-between">' +
      '<div class="flex min-w-0 items-center gap-3">' +
        '<span class="grid size-10 shrink-0 place-items-center rounded-xl ring-1 ring-inset ring-black/5 dark:ring-white/5 ' + P.tone.iconbox + '">' + icon('chart-gantt', 'size-5') + '</span>' +
        '<h1 class="min-w-0 truncate text-xl font-semibold tracking-tight text-zinc-900 sm:text-2xl dark:text-white">Planificación · ' + esc(P.label) + '</h1>' +
      '</div>' +
      '<div class="flex flex-wrap items-center gap-2">' +
        (myEmail() ? vgChip(u.mineOnly, 'gestion.mineOnly', 'user-round', 'Sólo lo mío', 'Mis proyectos y mis tareas') : '') +
        (data.ids.length ? vgChip(data.allOpen, 'gestion.planAll', data.allOpen ? 'list-collapse' : 'list-tree', data.allOpen ? 'Ocultar tareas' : 'Ver tareas', data.allOpen ? 'Contraer todos los proyectos' : 'Desplegar las tareas de todos los proyectos') : '') +
        vgChip(u.plan.closed, 'gestion.planClosed', 'archive', 'Cerrados', 'Incluir proyectos cerrados') +
        btn({ label: 'Hoy', icon: 'locate-fixed', variant: 'ghost', size: 'sm', action: 'gestion.planToday', title: 'Ir a hoy' }) +
        segmented({ action: 'gestion.planZoom', value: zoom, options: Object.keys(VG_ZOOM).map(k => ({ value: k, label: VG_ZOOM[k].label })) }) +
      '</div>' +
    '</div></div>';
}

function vgGantt(P, rows, R, zoom, anim) {
  const W = Math.round(R.days * VG_ZOOM[zoom].ppd);
  const end = addDays(R.b, 1);
  const X = d => {
    const v = vgDays(R.a, d) / R.days * 100;
    return Math.max(0, Math.min(100, v));
  };
  const tX = X(todayStr()) + 50 / R.days;            // mitad del día de hoy
  const f = n => n.toFixed(4) + '%';
  const seg = (a, b) => 'left:' + f(X(a)) + ';width:' + f(X(b) - X(a));

  // Encabezado de dos niveles (arriba: mes o año; abajo: semanas o meses)
  const top = [], bottom = [], lines = [];
  for (let m = R.a; m < end;) {
    const d = parseYmd(m);
    const next = ymd(new Date(d.getFullYear(), d.getMonth() + 1, 1));
    const to = next < end ? next : end;
    const jan = d.getMonth() === 0;
    lines.push('<div class="absolute inset-y-0 border-l ' + (jan || zoom === 'mes' ? 'border-zinc-200 dark:border-zinc-700/80' : 'border-zinc-100 dark:border-zinc-800') + '" style="left:' + f(X(m)) + '"></div>');
    if (zoom === 'mes') {
      top.push('<div class="absolute inset-y-0 border-l border-zinc-200 dark:border-zinc-700/80" style="' + seg(m, to) + '"><span class="sticky inline-block max-w-full truncate px-2 text-[11px] font-semibold leading-[22px] text-zinc-700 dark:text-zinc-200" style="left:var(--vg-label, 9.5rem)">' +
        esc(vgCap(MESES_LARGO[d.getMonth()]) + ' ' + d.getFullYear()) + '</span></div>');
    } else {
      bottom.push('<div class="absolute inset-y-0 border-l border-zinc-100 dark:border-zinc-800" style="' + seg(m, to) + '"><span class="block truncate px-1.5 text-[11px] leading-[22px] text-zinc-500 dark:text-zinc-400">' +
        esc(vgCap(MESES[d.getMonth()])) + '</span></div>');
    }
    m = next;
  }
  if (zoom === 'mes') {
    // Fines de semana sombreados (debajo de las líneas) y semanas que parten el lunes
    const shade = [];
    for (let day = R.a; day < end; day = addDays(day, 1)) {
      const w = parseYmd(day).getDay();
      if (w !== 6 && !(w === 0 && day === R.a)) continue;
      const to = addDays(day, w === 6 ? 2 : 1);
      shade.push('<div class="absolute inset-y-0 bg-zinc-50 dark:bg-white/[0.02]" style="' + seg(day, to < end ? to : end) + '"></div>');
    }
    lines.unshift(shade.join(''));
    let day = R.a;
    const dow = (parseYmd(day).getDay() + 6) % 7;
    if (dow) day = addDays(day, 7 - dow);
    for (; day < end; day = addDays(day, 7)) {
      const nx = addDays(day, 7);
      bottom.push('<div class="absolute inset-y-0 border-l border-zinc-100 dark:border-zinc-800" style="' + seg(day, nx < end ? nx : end) + '"><span class="block truncate px-1.5 text-[11px] tabular-nums leading-[22px] text-zinc-500 dark:text-zinc-400">' + esc(fmtDateShort(day)) + '</span></div>');
      lines.push('<div class="absolute inset-y-0 border-l border-zinc-100 dark:border-zinc-800/60" style="left:' + f(X(day)) + '"></div>');
    }
  } else {
    // Años arriba
    for (let y = parseYmd(R.a).getFullYear(); y <= parseYmd(R.b).getFullYear(); y++) {
      const a = vgMaxD(R.a, y + '-01-01'), b = vgMinD(end, (y + 1) + '-01-01');
      top.push('<div class="absolute inset-y-0 border-l border-zinc-200 dark:border-zinc-700/80" style="' + seg(a, b) + '"><span class="sticky inline-block px-2 text-[11px] font-semibold tabular-nums leading-[22px] text-zinc-700 dark:text-zinc-200" style="left:var(--vg-label, 9.5rem)">' + y + '</span></div>');
    }
  }

  const header = '<div class="sticky top-0 z-20 flex border-b border-zinc-200 bg-white dark:border-zinc-800 dark:bg-zinc-900">' +
    '<div data-vg-label class="sticky left-0 z-30 flex shrink-0 items-end border-r border-zinc-200 bg-white px-3 pb-1 text-[11px] font-medium text-zinc-400 dark:border-zinc-800 dark:bg-zinc-900 dark:text-zinc-500" style="width:var(--vg-label, 9.5rem)">Proyectos y tareas</div>' +
    '<div data-vg-timeline class="relative h-11 min-w-0 flex-1">' +
      // Sin overflow-hidden aquí: las etiquetas del nivel superior son sticky respecto del contenedor con scroll
      '<div class="absolute inset-x-0 top-0 h-[22px]">' + top.join('') + '</div>' +
      '<div class="absolute inset-x-0 bottom-0 h-[22px] border-t border-zinc-100 dark:border-zinc-800">' + bottom.join('') + '</div>' +
      '<span class="absolute ' + (zoom === 'mes' ? 'bottom-[3px]' : 'top-[3px]') + ' z-[1] -translate-x-1/2 rounded-full bg-indigo-600 px-1.5 text-[10px] font-semibold leading-4 text-white shadow-sm dark:bg-indigo-500" style="left:' + f(tX) + '">Hoy</span>' +
    '</div></div>';

  const body = rows.map(r => vgGanttRow(P, r, X, f, end)).join('');
  return '<div class="overflow-hidden ' + CX.card + ' ' + vgA(anim) + '">' +
    '<div data-vg-gantt="' + esc(P.key + ':' + zoom + ':' + R.a) + '" data-today="' + tX.toFixed(4) + '" class="relative max-h-[calc(100dvh-16rem)] min-h-72 overflow-auto overscroll-x-contain [--vg-label:9.5rem] sm:[--vg-label:15rem] lg:[--vg-label:18rem]">' +
      '<div class="relative" style="width:max(100%, calc(var(--vg-label, 9.5rem) + ' + W + 'px))">' +
        header +
        '<div class="relative">' +
          '<div class="pointer-events-none absolute inset-y-0 right-0" style="left:var(--vg-label, 9.5rem)" aria-hidden="true">' + lines.join('') + '</div>' +
          body +
          '<div class="pointer-events-none absolute inset-y-0 right-0 z-[5]" style="left:var(--vg-label, 9.5rem)" aria-hidden="true">' +
            '<div class="absolute inset-y-0 w-px bg-indigo-500/70 dark:bg-indigo-400/70" style="left:' + f(tX) + '"></div></div>' +
        '</div>' +
      '</div>' +
    '</div></div>';
}

function vgGanttRow(P, r, X, f, end) {
  const labelCls = 'sticky left-0 z-10 flex shrink-0 items-center gap-2 border-r border-zinc-200 bg-white pr-3 transition-colors group-hover/row:bg-zinc-50 dark:border-zinc-800 dark:bg-zinc-900 dark:group-hover/row:bg-zinc-800';
  const lane = inner => '<div class="relative min-w-0 flex-1 transition-colors group-hover/row:bg-zinc-500/[0.04]">' + inner + '</div>';
  if (r.type === 'group') {
    return '<div class="flex h-8 border-t border-zinc-100 dark:border-zinc-800">' +
      '<div class="sticky left-0 z-10 flex shrink-0 items-center border-r border-zinc-200 bg-zinc-50 px-3 dark:border-zinc-800 dark:bg-zinc-950" style="width:var(--vg-label, 9.5rem)">' +
        '<span class="truncate text-[10px] font-semibold uppercase tracking-wider text-zinc-500 dark:text-zinc-400" title="' + esc(r.label) + '">' + esc(r.label) + '</span></div>' +
      '<div class="relative min-w-0 flex-1 bg-zinc-50/70 dark:bg-zinc-950/40"></div></div>';
  }
  const span = (s, e) => {
    const a = X(s), b = X(addDays(e, 1) < end ? addDays(e, 1) : end);
    return { a: a, w: Math.max(0, b - a) };
  };
  if (r.type === 'project') {
    const p = r.p;
    const est = vgPEstado(p);
    const B = est === 'Activo' ? (VG_BAR[P.color] || VG_BAR.zinc) : VG_BAR.zinc;
    const tip = p.nombre + '\n' + (r.dot ? 'Sin fechas aún' : fmtDate(r.s) + ' → ' + fmtDate(r.e) + (r.est ? ' (estimadas por sus tareas)' : '')) +
      (r.total ? '\n' + r.done + ' de ' + r.total + ' tareas listas' : '') + (est !== 'Activo' ? '\n' + est : '');
    const chevron = r.nList
      ? '<button type="button" data-action="gestion.planToggle" data-id="' + esc(p.id) + '" aria-expanded="' + !!r.open + '" title="' + (r.open ? 'Ocultar tareas' : 'Ver tareas') + '" class="grid size-5 shrink-0 place-items-center rounded text-zinc-400 transition hover:bg-zinc-200/70 hover:text-zinc-700 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500/60 dark:hover:bg-zinc-700 dark:hover:text-zinc-200">' + icon(r.open ? 'chevron-down' : 'chevron-right', 'size-3.5') + '</button>'
      : '<span class="size-5 shrink-0" aria-hidden="true"></span>';
    let bar = '';
    if (r.dot) {
      // Pista discreta pegada al borde visible de la línea de tiempo
      bar = '<div class="flex h-full items-center"><button type="button" data-action="gestion.openProject" data-id="' + esc(p.id) + '" title="Abre el proyecto para darle fecha de inicio y de término" ' +
        'class="sticky ml-2 rounded px-1.5 py-0.5 text-[11px] text-zinc-400 transition-colors hover:bg-zinc-100 hover:text-zinc-700 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500/60 dark:text-zinc-500 dark:hover:bg-zinc-800 dark:hover:text-zinc-200" style="left:calc(var(--vg-label, 9.5rem) + 0.5rem)">Sin fechas aún</button></div>';
    } else if (r.s) {
      const sp = span(r.s, r.e);
      if (sp.w > 0) {
        bar = '<button type="button" data-action="gestion.openProject" data-id="' + esc(p.id) + '" title="' + esc(tip) + '" aria-label="' + esc(p.nombre) + '" class="absolute top-1/2 h-[18px] -translate-y-1/2 overflow-hidden rounded-md transition hover:brightness-95 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500/60 dark:hover:brightness-125 ' + B.track + ' ' +
          (r.est ? 'border border-dashed ' + B.line : 'ring-1 ring-inset ring-black/5 dark:ring-white/10') + '" style="left:' + f(sp.a) + ';width:' + f(sp.w) + ';min-width:8px">' +
          (r.pct ? '<span class="bar-grow absolute inset-y-0 left-0 ' + B.fill + '" style="width:' + r.pct + '%"></span>' : '') + '</button>' +
          (r.total ? '<span class="pointer-events-none absolute top-1/2 -translate-y-1/2 whitespace-nowrap pl-2 text-[11px] tabular-nums text-zinc-500 dark:text-zinc-400" style="left:' + f(sp.a + sp.w) + '">' + r.pct + '%</span>' : '');
      }
    }
    return '<div class="group/row flex h-11 border-t border-zinc-100 dark:border-zinc-800/70">' +
      '<div class="' + labelCls + ' pl-1.5" style="width:var(--vg-label, 9.5rem)">' + chevron +
        '<button type="button" data-action="gestion.openProject" data-id="' + esc(p.id) + '" title="' + esc(p.nombre) + '" class="min-w-0 flex-1 truncate rounded text-left text-[13px] font-medium ' + (est === 'Activo' ? 'text-zinc-800 dark:text-zinc-100' : 'text-zinc-500 dark:text-zinc-400') + ' transition-colors hover:text-indigo-600 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500/60 dark:hover:text-indigo-400">' + esc(p.nombre) + '</button>' +
        (p.resp ? '<span class="hidden sm:inline-flex">' + avatar(p.resp, 'xs') + '</span>' : '') +
      '</div>' + lane(bar) + '</div>';
  }
  // Tarea
  const t = r.t;
  const B = VG_BAR[P.color] || VG_BAR.zinc;
  const color = r.state === 'done' ? 'bg-emerald-500/80 dark:bg-emerald-400/70' : r.state === 'overdue' ? 'bg-red-400/80 dark:bg-red-400/60' : B.task;
  const tip = t.nombre + '\n' + (r.state === 'done'
    ? 'Lista' + (t.completada ? ' el ' + fmtDate(t.completada) : '')
    : t.fecha ? (r.state === 'overdue' ? 'Atrasada · venció el ' : 'Vence el ') + fmtDate(t.fecha) : 'Sin fecha de término') +
    (r.s ? '\nCreada el ' + fmtDate(vgDateOf(t.creado) || r.s) : '') + (t.resp ? '\n' + userName(t.resp) : '');
  const st = r.state === 'done' ? icon('circle-check', 'size-3.5 shrink-0 text-emerald-500')
    : r.state === 'overdue' ? icon('clock-alert', 'size-3.5 shrink-0 text-red-500 dark:text-red-400')
      : icon('circle', 'size-3.5 shrink-0 text-zinc-300 dark:text-zinc-600');
  let bar = '';
  if (r.s) {
    const sp = span(r.s, r.e);
    if (r.dot) {
      bar = '<button type="button" data-action="gestion.openTask" data-id="' + esc(t.id) + '" title="' + esc(tip) + '" aria-label="' + esc(t.nombre) + '" class="absolute top-1/2 size-2.5 -translate-x-1/2 -translate-y-1/2 rounded-full ring-2 ring-white focus-visible:outline-none focus-visible:ring-indigo-500/60 dark:ring-zinc-900 ' +
        (r.state === 'done' ? 'bg-emerald-500/80' : 'bg-zinc-300 dark:bg-zinc-600') + '" style="left:' + f(sp.a + sp.w / 2) + '"></button>';
    } else if (sp.w > 0) {
      bar = '<button type="button" data-action="gestion.openTask" data-id="' + esc(t.id) + '" title="' + esc(tip) + '" aria-label="' + esc(t.nombre) + '" class="absolute top-1/2 h-2 -translate-y-1/2 rounded-full transition hover:h-2.5 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500/60 ' + color + '" style="left:' + f(sp.a) + ';width:' + f(sp.w) + ';min-width:6px"></button>';
      if (r.state === 'overdue') {
        // Desde el vencimiento hasta hoy: una línea punteada suave
        const od = span(addDays(t.fecha, 1), todayStr());
        if (od.w > 0) bar = '<span class="pointer-events-none absolute top-1/2 -translate-y-1/2 border-t border-dashed border-red-300 dark:border-red-500/40" style="left:' + f(od.a) + ';width:' + f(od.w) + '"></span>' + bar;
      }
    }
  }
  return '<div class="group/row flex h-9">' +
    '<div class="' + labelCls + ' ' + (r.nested ? 'pl-9' : 'pl-3') + '" style="width:var(--vg-label, 9.5rem)">' + st +
      '<button type="button" data-action="gestion.openTask" data-id="' + esc(t.id) + '" title="' + esc(t.nombre) + '" class="min-w-0 flex-1 truncate rounded text-left text-xs transition-colors hover:text-indigo-600 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500/60 dark:hover:text-indigo-400 ' +
        (r.state === 'done' ? 'text-zinc-400 line-through decoration-zinc-300 dark:text-zinc-500 dark:decoration-zinc-600' : 'text-zinc-700 dark:text-zinc-300') + '">' + esc(t.nombre) + '</button>' +
      (t.privada ? '<span class="shrink-0 text-zinc-400 dark:text-zinc-500" title="Privada">' + icon('lock', 'size-3') + '</span>' : '') +
    '</div>' + lane(bar) + '</div>';
}

// Leyenda mínima: sólo lo que no se deduce de las barras (el resto va en el title de cada barra).
function vgPlanLegend(P) {
  const b = VG_BAR[P.color] || VG_BAR.zinc;
  const item = (sw, label) => '<span class="inline-flex items-center gap-1.5">' + sw + esc(label) + '</span>';
  return '<div class="mt-2 flex flex-wrap items-center gap-x-4 gap-y-1 px-1 text-[11px] text-zinc-400 dark:text-zinc-500">' +
    item('<span class="inline-block h-2 w-5 rounded-sm border border-dashed ' + b.line + ' ' + b.track + '"></span>', 'Fechas estimadas') +
    item('<span class="inline-block h-1.5 w-5 rounded-full bg-red-400/80 dark:bg-red-400/60"></span>', 'Atrasada') +
    item('<span class="inline-block size-2 rounded-full bg-zinc-300 dark:bg-zinc-600"></span>', 'Sin fecha') +
  '</div>';
}

// Desplaza la línea de tiempo para que «Hoy» quede a un tercio del área visible.
function vgPlanScrollToday(sc, smooth) {
  const tl = sc.querySelector('[data-vg-timeline]');
  const lab = sc.querySelector('[data-vg-label]');
  if (!tl) return;
  const lw = lab ? lab.offsetWidth : 0;
  const x = tl.offsetWidth * (Number(sc.dataset.today) || 0) / 100;
  const left = Math.max(0, x - Math.max(0, sc.clientWidth - lw) * 0.3);
  if (smooth && typeof sc.scrollTo === 'function') sc.scrollTo({ left: left, behavior: 'smooth' });
  else sc.scrollLeft = left;
}
// Tailwind (runtime) compila las clases nuevas de forma asíncrona: se espera a que el contenedor ya tenga scroll.
function vgPlanWhenReady(sc, fn, tries) {
  tries = tries || 0;
  if (!sc.isConnected) return;
  let ready = false;
  try { ready = !!getComputedStyle(sc).getPropertyValue('--vg-label').trim() && sc.scrollWidth > sc.clientWidth + 1; } catch (e) { ready = true; }
  if (ready || tries >= 240) { fn(); return; }
  requestAnimationFrame(() => vgPlanWhenReady(sc, fn, tries + 1));
}
function vgPlanMount(root, params, o) {
  const sc = root.querySelector('[data-vg-gantt]');
  if (!sc) return;
  const key = sc.getAttribute('data-vg-gantt');
  const prev = VG.planScroll;
  // Al llegar (o al cambiar zoom/rango) parte en hoy; en un redibujo conserva la posición.
  const fresh = (o && o.animate) || !prev || prev.key !== key;
  if (!fresh) { sc.scrollLeft = prev.left; sc.scrollTop = prev.top; }
  vgPlanWhenReady(sc, () => {
    if (fresh) vgPlanScrollToday(sc, false);
    else if (Math.abs(sc.scrollLeft - prev.left) > 1) { sc.scrollLeft = prev.left; sc.scrollTop = prev.top; }
    VG.planScroll = { key: key, left: sc.scrollLeft, top: sc.scrollTop };
    sc.addEventListener('scroll', () => { VG.planScroll = { key: key, left: sc.scrollLeft, top: sc.scrollTop }; }, { passive: true });
  });
}

/* =====================================================================
   Alta rápida en línea (pilar): Enter → fecha → tarea optimista
   - Si el texto ya trae una fecha natural («… mañana», «… viernes», «… 15/10»; todoParse de TodoPanel), se usa esa.
   - Si no, se pregunta con pickDate (Core): null = cancelar y conservar el texto; '' = sin fecha; fecha = esa fecha.
   - La fila aparece al instante y sigue a la vista aunque llegue antes la respuesta de otra alta (VG.temps).
   - v3.2 (§15): en un proyecto se crea compartida (privada: false); en «sin proyecto», privada (vgQuickPrivada).
   ===================================================================== */
function vgAddTarget(key) {
  if (/^sp-/.test(key)) { const pk = key.slice(3); return PIL(pk) ? { p: null, pk: pk } : null; }
  const p = IDX.project.get(key);
  if (!p) return null;
  if (vgPEstado(p) === 'Cerrado') { toast('Este proyecto está cerrado. Reábrelo para sumar tareas.', 'info'); return null; }
  return { p: p, pk: p.pilar };
}
function vgCleanText(v) { return String(v == null ? '' : v).replace(/\s+/g, ' ').trim().slice(0, 200); }
// Fecha escrita al final del texto (reutiliza el parser de la lista personal; sin él, siempre se pregunta).
function vgNaturalDate(text) {
  if (typeof todoParse !== 'function') return null;
  try {
    const r = todoParse(text, todayStr());
    return r && r.fecha && /^\d{4}-\d{2}-\d{2}$/.test(r.fecha) && vgCleanText(r.nombre) ? { nombre: vgCleanText(r.nombre), fecha: r.fecha } : null;
  } catch (e) { console.error(e); return null; }
}
function vgFocusAdd(key) {
  const inp = document.getElementById('vg-add-' + key);
  if (inp) { try { inp.focus(); } catch (e) {} }
}
function vgQuickAdd(key, el) {
  const raw = vgCleanText(el && el.value);
  if (!raw || !S) return;
  const target = vgAddTarget(key);
  if (!target) return;
  const nat = vgNaturalDate(raw);
  if (nat) { vgCreateTask(key, target, nat.nombre, nat.fecha, raw, el); return; }
  if (typeof pickDate !== 'function') { vgCreateTask(key, target, raw, '', raw, el); return; }
  let pick;
  try { pick = pickDate(el, { title: '¿Para cuándo?' }); } catch (e) { console.error(e); pick = null; }
  if (!pick || typeof pick.then !== 'function') { vgCreateTask(key, target, raw, '', raw, el); return; }
  pick.then(f => {
    if (f == null) { vgFocusAdd(key); return; }            // Esc / clic afuera: no se crea nada y el texto queda
    vgCreateTask(key, target, raw, String(f), raw, el);
  }, e => { console.error(e); vgCreateTask(key, target, raw, '', raw, el); });  // sin selector: se crea igual, sin fecha
}
// Privacidad de un alta en línea (SPEC §15): dentro de un proyecto la ve el equipo; «sin proyecto» queda privada,
// salvo que el servidor no sepa quién eres (una privada que nadie puede ver no sirve, y el servidor la rechaza).
function vgQuickPrivada(p) {
  const known = !!(S && S.me && S.me.email && S.me.email !== 'desconocido');
  return !p && known;
}
function vgCreateTask(key, target, nombre, fecha, raw, el) {
  const me = myEmail();
  const p = target.p;
  // El proyecto pudo cerrarse o eliminarse mientras se elegía la fecha
  if (p && (!IDX.project.has(p.id) || vgPEstado(IDX.project.get(p.id)) === 'Cerrado')) { toast('Este proyecto ya no admite tareas nuevas.', 'info'); return; }
  const c = p && p.cascade ? IDX.cascade.get(p.cascade) : null;
  // Hereda sólo un indicador hoja del proyecto (no un grupo), como el alta rápida del drawer.
  const ent = { tipo: 'Tarea', pilar: target.pk, proyecto: p ? p.id : '', nombre: nombre, detalle: '', resp: me || (p && p.resp) || '',
    fecha: fecha || '', cascade: c && c.padre ? c.id : '', evidencias: [], estado: 'Pendiente', avisar: true, privada: vgQuickPrivada(p) };
  const tmp = { id: 'tmp-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), _tmp: true, pilar: ent.pilar, proyecto: ent.proyecto,
    nombre: nombre, detalle: '', resp: ent.resp, fecha: ent.fecha, estado: 'Pendiente', cascade: ent.cascade, evidencias: [], cierre: '', completada: '',
    creadoPor: me, creado: new Date().toISOString(), actualizadoPor: me, actualizado: '', privada: ent.privada, avisar: true, orden: 0 };
  // Se vacía el input (y el actual, si la vista se redibujó mientras se elegía la fecha) sólo si aún tiene ese texto
  [el, document.getElementById('vg-add-' + key)].forEach(x => { if (x && vgCleanText(x.value) === raw) x.value = ''; });
  vgUi().addOpen = key;
  VG.focusAdd = key;
  if (typeof optimistic !== 'function') { mutate('gSave', [ent], { success: 'Tarea agregada' }); return; }
  const entry = { task: tmp, known: new Set((S.tasks || []).map(t => t.id)), at: Date.now(), realId: '' };
  VG.temps.push(entry);
  optimistic(() => { S.tasks = (S.tasks || []).concat([tmp]); }, 'gSave', [ent]).then(b => {
    const pending = VG.temps.indexOf(entry) >= 0;
    if (b && b.lastId) {
      // Si el servidor normalizó el nombre, la temporal se retira por id en el próximo dibujo
      if (pending) { entry.realId = b.lastId; rerender(); }
      return;
    }
    if (b) return;                                            // guardado con recarga pendiente: aterriza solo
    // Falló (Core ya avisó): se retira la fila y el texto vuelve al input si quedó vacío
    VG.temps = VG.temps.filter(x => x !== entry);
    S.tasks = (S.tasks || []).filter(t => t.id !== tmp.id);
    rebuildIndex(); renderShell(); rerender();
    const inp = document.getElementById('vg-add-' + key);
    if (inp && !inp.value) inp.value = raw;
  });
}

/* =====================================================================
   Registro de vistas y acciones
   ===================================================================== */
registerView('gestion.overview', { wide: true, title: 'Vista general', render: vgOverview, mount: vgTodoMount });
registerView('gestion.pillar', { wide: true, title: params => { const p = PIL(params.pilar); return p ? p.label : 'Gestión'; }, render: vgPillar, mount: vgPillarMount });
registerView('gestion.plan', { wide: true, title: params => { const p = PIL(params.pilar); return 'Planificación' + (p ? ' · ' + p.label : ''); }, render: vgPlan, mount: vgPlanMount });

action('gestion.newProject', d => vgOpenProjectForm(d.pilar ? { pilar: d.pilar } : {}));
action('gestion.newTask', d => {
  const o = {};
  ['pilar', 'proyecto', 'fecha', 'cascade'].forEach(k => { if (d[k]) o[k] = d[k]; });
  vgOpenTaskForm(o);
});
action('gestion.openProject', d => vgOpenProject(d.id));
action('gestion.openTask', d => { if (d.id && !/^tmp-/i.test(d.id)) vgOpenTask(d.id); });
action('gestion.q', (d, el) => { vgUi().pq[d.pilar || ''] = el.value; vgSoon(); });
action('gestion.mineOnly', () => { const u = vgUi(); u.mineOnly = !u.mineOnly; rerender(); });
action('gestion.clear', d => { const u = vgUi(); if (d.pilar) u.pq[d.pilar] = ''; u.mineOnly = false; rerender(); });
action('gestion.mode', d => { vgUi().mode[d.pilar] = d.value === 'indicadores' ? 'indicadores' : 'proyectos'; VG.route = null; rerender(); });
action('gestion.more', d => { const u = vgUi(); u.more[d.key] = !u.more[d.key]; rerender(); });
action('gestion.doneToggle', d => { const u = vgUi(); u.doneOpen[d.key] = !u.doneOpen[d.key]; rerender(); });
action('gestion.showClosed', () => { const u = vgUi(); u.showClosed = !u.showClosed; rerender(); });
action('gestion.addOpen', d => { const u = vgUi(); u.addOpen = d.key || ''; VG.focusAdd = u.addOpen; rerender(); });
action('gestion.addClose', () => { vgUi().addOpen = ''; rerender(); });
// Alta rápida dentro de un proyecto (o sin proyecto): Enter → ¿para cuándo? → aparece al tiro (SPEC §14.2).
action('gestion.addTask', (d, el) => vgQuickAdd(d.key || '', el));
action('gestion.upAll', () => { const u = vgUi(); u.upAll = !u.upAll; rerender(); });
action('gestion.team', d => { const u = vgUi(); u.teamOpen = u.teamOpen === d.email ? null : d.email; rerender(); });
action('gestion.casToggle', d => { const u = vgUi(); u.casOpen[d.id] = !u.casOpen[d.id]; rerender(); });
// Catálogo Cascade abierto en el pilar que se está viendo (mismo estado de VAdmin que usa asstOpenCascade)
action('gestion.catalog', d => {
  if (d.pilar && typeof admState === 'function') { const A = admState(); A.pilar = d.pilar; A.casQ = ''; }
  go('#/cascade');
});
// Planificación
action('gestion.planZoom', d => {
  const u = vgUi();
  u.plan.zoom = VG_ZOOM[d.value] ? d.value : 'trimestre';
  LS.set('planZoom', u.plan.zoom);
  rerender();
});
action('gestion.planToggle', d => { const u = vgUi(); u.plan.open[d.id] = !u.plan.open[d.id]; rerender(); });
action('gestion.planAll', () => {
  const u = vgUi();
  const P = PIL(S.route && S.route.params && S.route.params.pilar);
  if (!P) return;
  const data = vgPlanData(P);
  if (data.allOpen) data.ids.forEach(id => { u.plan.open[id] = false; });
  else data.ids.forEach(id => { u.plan.open[id] = true; });
  rerender();
});
action('gestion.planClosed', () => { const u = vgUi(); u.plan.closed = !u.plan.closed; rerender(); });
action('gestion.planToday', () => { const sc = document.querySelector('[data-vg-gantt]'); if (sc) vgPlanScrollToday(sc, true); });
</script>
