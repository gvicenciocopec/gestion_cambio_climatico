<script>
/* =====================================================================
   VAdmin · vistas 'cascade' (Indicadores Cascade), 'history' (Historial,
   sólo administración) y 'settings' (Ajustes: perfil, privacidad, avisos y,
   para administración, «Ver como admin», carpetas de Drive, proyectos desde
   Cascade y solicitudes de Ariba).
   Ver dev/SPEC.md §5, §6.4, §7, §9, §11, §13, §14. Prefijo global: adm* / ADM_*
   v3.1 (§14.4): menos texto; lo de administración sigue isAdminUI() (con «Ver como
   admin» apagado, Gonzalo ve exactamente lo que ve el equipo; el interruptor sí queda).
   ===================================================================== */

const ADM_HIST_PAGE = 120;
const ADM_T = {};
const ADM_ETIQUETAS = ['Iniciativa', 'Iniciativa Estratégica Organizacional', 'Colaboración I. Estratégica'];
const ADM_CLASES = ['kpi', 'accion', 'objetivo', 'hito'];
const ADM_CLASE_DESC = {
  kpi: 'Métrica con meta',
  accion: 'Actividad a ejecutar',
  objetivo: 'Resultado esperado',
  hito: 'Entregable o fecha clave',
};
const ADM_KINDS = {
  create: { label: 'Crear', icon: 'plus', tone: 'emerald' },
  edit: { label: 'Editar', icon: 'pencil', tone: 'indigo' },
  complete: { label: 'Completar', icon: 'circle-check', tone: 'emerald' },
  comment: { label: 'Comentar', icon: 'message-square', tone: 'sky' },
  delete: { label: 'Eliminar', icon: 'trash', tone: 'red' },
  notif: { label: 'Notificación', icon: 'bell', tone: 'amber' },
  other: { label: 'Otro', icon: 'circle-dot', tone: 'zinc' },
};
const ADM_DIAS = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];

/* ---------- Estado y utilidades locales ---------- */
function admState() {
  S.ui.admin = S.ui.admin || { pilar: 'cc', open: {}, histQ: '', histUser: 'all', hist: null, status: null };
  const A = S.ui.admin;
  if (!A.open) A.open = {};
  if (A.casQ == null) A.casQ = '';
  if (A.histType == null) A.histType = 'all';
  if (A.histShow == null) A.histShow = ADM_HIST_PAGE;
  if (!A.busy) A.busy = {};
  if (!(S.pillars || []).some(p => p.key === A.pilar)) A.pilar = ((S.pillars || [])[0] || {}).key || 'cc';
  return A;
}
function admLater(key, fn, ms) { clearTimeout(ADM_T[key]); ADM_T[key] = setTimeout(fn, ms); }
function admRerenderIf(view) { if (S && S.route && S.route.name === view) rerender(); }
// Resalta coincidencias (sin romper entidades HTML)
function admHl(text, q) {
  const s = String(text == null ? '' : text), qq = String(q || '').trim();
  if (!qq) return esc(s);
  const lo = s.toLowerCase(), ql = qq.toLowerCase();
  let out = '', i = 0, k;
  while ((k = lo.indexOf(ql, i)) >= 0) {
    out += esc(s.slice(i, k)) + '<mark class="hl">' + esc(s.slice(k, k + ql.length)) + '</mark>';
    i = k + ql.length;
  }
  return out + esc(s.slice(i));
}
function admSpin(label) {
  return btn({ label: label, icon: 'loader-circle', variant: 'secondary', disabled: true, cls: '[&_svg]:animate-spin' });
}
function admIconBox(name, t, cls) {
  return '<span class="grid shrink-0 place-items-center rounded-lg ' + tone(t).iconbox + ' ' + (cls || 'size-9') + '">' + icon(name, 'size-4') + '</span>';
}
function admKbd(keys) {
  return '<span class="inline-flex items-center gap-1">' + keys.map(k => '<kbd class="' + CX.kbd + '">' + esc(k) + '</kbd>').join('') + '</span>';
}
// Administración en pantalla (respeta «Ver como admin»); admRealAdmin = la cuenta lo es (sólo para el interruptor)
function admIsAdmin() { return typeof isAdminUI === 'function' ? isAdminUI() : !!(S && S.me && S.me.admin); }
function admRealAdmin() { return !!(S && S.me && S.me.admin); }

/* =====================================================================
   1) Indicadores Cascade
   ===================================================================== */
function admEtqTone(e) {
  const n = normTxt(e);
  if (n === 'iniciativa') return 'indigo';
  if (n.indexOf('iniciativa estrategica') === 0) return 'amber';
  return 'zinc';
}
function admEtqTag(e) {
  const s = String(e || '').trim();
  if (!s || s === '—' || s === '-') return '';
  return '<span class="inline-flex max-w-full items-center gap-1.5 rounded-md border border-zinc-200 bg-white px-1.5 py-0.5 text-[11px] font-medium text-zinc-600 dark:border-zinc-700 dark:bg-zinc-800/60 dark:text-zinc-300" title="Etiqueta en Cascade">' +
    '<span class="size-2 shrink-0 rounded-[3px] ' + tone(admEtqTone(s)).dot + '" aria-hidden="true"></span><span class="truncate">' + esc(s) + '</span></span>';
}
function admTasksByCascade() {
  const m = new Map();
  (S.tasks || []).forEach(t => {
    if (!t.cascade) return;
    if (!m.has(t.cascade)) m.set(t.cascade, []);
    m.get(t.cascade).push(t);
  });
  return m;
}
function admProjectsByCascade() {
  const m = new Map();
  (S.projects || []).forEach(p => {
    if (!p.cascade) return;
    if (!m.has(p.cascade)) m.set(p.cascade, []);
    m.get(p.cascade).push(p);
  });
  return m;
}
function admItemStats(list) {
  const pend = list.filter(t => t.estado !== 'Realizada');
  const done = list.filter(t => t.estado === 'Realizada');
  return {
    total: list.length,
    pending: pend.length,
    overdue: pend.filter(t => dueInfo(t).key === 'overdue').length,
    done: done.length,
    doneYear: done.filter(t => taskInYear(t, S.year)).length,
  };
}
function admIsOpen(A, id) { return A.open[id] !== false; }
function admEnt(x, patch) {
  return Object.assign({
    tipo: 'Cascade', id: x.id, pilar: x.pilar, padre: x.padre || '', nombre: x.nombre,
    etiqueta: x.etiqueta || '', clase: x.clase || (x.padre ? 'accion' : 'grupo'), orden: Number(x.orden) || 0,
  }, patch || {});
}
function admNextOrden(list) { return (list || []).reduce((m, x) => Math.max(m, Number(x.orden) || 0), 0) + 1; }
function admSiblings(it) { return it.padre ? (IDX.cascadeChildren.get(it.padre) || []) : (IDX.cascadeGroups[it.pilar] || []); }

function admCascadeView() {
  const A = admState();
  const pil = PIL(A.pilar);
  const groups = IDX.cascadeGroups[A.pilar] || [];
  const tmap = admTasksByCascade();
  const pmap = admProjectsByCascade();
  const q = normTxt(A.casQ);
  const anim = A.justOpened; A.justOpened = null;

  const shown = groups.map(g => {
    const kids = IDX.cascadeChildren.get(g.id) || [];
    if (!q) return { g: g, kids: kids, all: kids };
    if (normTxt(g.nombre + ' ' + (g.etiqueta || '')).indexOf(q) >= 0) return { g: g, kids: kids, all: kids };
    const km = kids.filter(c => normTxt(c.nombre).indexOf(q) >= 0);
    return km.length ? { g: g, kids: km, all: kids } : null;
  }).filter(Boolean);

  const header = pageHeader({
    title: 'Indicadores Cascade', icon: 'target', tone: 'violet',
    right: btn({ label: 'Nuevo grupo', icon: 'plus', variant: 'primary', action: 'cascade.newGroup' }),
  });

  const toolbar = '<div class="mb-4 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">' +
    segmented({
      value: A.pilar, action: 'cascade.pilar',
      options: S.pillars.map(p => ({ value: p.key, label: p.label, icon: p.icon })),
    }) +
    '<div class="flex items-center gap-1.5">' +
    searchInput({ id: 'q-cascade', input: 'cascade.q', value: A.casQ, placeholder: 'Buscar indicador…', cls: 'w-full sm:w-64' }) +
    iconBtn({ icon: 'chevrons-up-down', action: 'cascade.expandAll', title: 'Expandir todo' }) +
    iconBtn({ icon: 'chevrons-down-up', action: 'cascade.collapseAll', title: 'Contraer todo' }) +
    '</div></div>';

  let tree;
  if (!groups.length) {
    tree = card(emptyState({
      icon: 'target', title: 'Sin indicadores en ' + (pil ? pil.label : 'este pilar'),
      actionHtml: btn({ label: 'Nuevo grupo', icon: 'plus', variant: 'primary', action: 'cascade.newGroup' }),
    }));
  } else if (!shown.length) {
    tree = card(emptyState({ icon: 'search', title: 'Sin resultados' }));
  } else {
    tree = '<div class="space-y-3">' + shown.map(x => admGroupCard(A, x.g, x.kids, x.all, tmap, !!q, anim === x.g.id, pmap)).join('') + '</div>';
  }

  // §14.4: sin columna de cifras ni leyenda (el tipo ya va en cada fila)
  return '<div class="max-w-5xl">' + header + toolbar + tree + '</div>';
}

function admGroupCard(A, g, kids, all, tmap, searching, anim, pmap) {
  const open = searching || admIsOpen(A, g.id);
  const st = admItemStats(all.reduce((a, c) => a.concat(tmap.get(c.id) || []), []));
  // Sólo lo que pide atención: pendientes (y atrasadas en rojo); sin conteos de indicadores
  const pendTxt = st.pending ? '<span class="tabular-nums">' + esc(plural(st.pending, 'pendiente', 'pendientes')) + '</span>' : '';
  const lateTxt = st.overdue ? '<span class="inline-flex items-center gap-1 font-medium text-red-600 dark:text-red-400">' + icon('triangle-alert', 'size-3') + esc(plural(st.overdue, 'atrasada', 'atrasadas')) + '</span>' : '';

  const head = '<div class="flex items-center gap-2 px-2 py-2 sm:gap-3 sm:px-3">' +
    '<button type="button" id="cas-tg-' + esc(g.id) + '" data-action="cascade.toggle" data-id="' + esc(g.id) + '" aria-expanded="' + open + '" title="' + (open ? 'Contraer' : 'Expandir') + '" class="flex min-w-0 flex-1 items-center gap-2.5 rounded-lg p-1 text-left transition focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500/60 sm:gap-3">' +
    '<span class="grid size-5 shrink-0 place-items-center text-zinc-400 transition-transform duration-200 dark:text-zinc-500 ' + (open ? 'rotate-90' : '') + '">' + icon('chevron-right', 'size-4') + '</span>' +
    '<span class="grid size-9 shrink-0 place-items-center rounded-lg bg-violet-50 text-violet-600 ring-1 ring-inset ring-violet-500/15 dark:bg-violet-500/15 dark:text-violet-300 dark:ring-violet-400/20">' + icon('target', 'size-4') + '</span>' +
    '<span class="min-w-0 flex-1">' +
    '<span class="line-clamp-2 break-words text-sm font-semibold text-zinc-900 dark:text-zinc-100">' + admHl(g.nombre, A.casQ) + '</span>' +
    '<span class="mt-1 flex flex-wrap items-center gap-x-2 gap-y-1 text-xs text-zinc-500 dark:text-zinc-400">' + admEtqTag(g.etiqueta) + pendTxt + lateTxt + '</span></span></button>' +
    '<div class="flex shrink-0 items-center">' +
    iconBtn({ icon: 'plus', action: 'cascade.addItem', data: { padre: g.id }, title: 'Agregar indicador' }) +
    iconBtn({ icon: 'pencil', action: 'cascade.edit', data: { id: g.id }, title: 'Editar grupo' }) +
    iconBtn({ icon: 'trash', action: 'cascade.delete', data: { id: g.id }, title: 'Eliminar grupo', variant: 'danger-ghost' }) +
    '</div></div>';

  let body = '';
  if (open) {
    const sibs = IDX.cascadeChildren.get(g.id) || [];
    body = '<div class="border-t border-zinc-100 py-1.5 dark:border-zinc-800/80 ' + (anim ? 'anim-fade-in' : '') + '">' +
      (kids.length ? kids.map((c, i) => admChildRow(A, c, i === kids.length - 1, sibs, tmap, searching, pmap)).join('') :
        '<div class="py-2 pl-9 pr-3 sm:pl-[4.75rem]">' +
        btn({ label: 'Agregar indicador', icon: 'plus', size: 'sm', variant: 'ghost', action: 'cascade.addItem', data: { padre: g.id } }) + '</div>') +
      '</div>';
  }
  return '<section class="' + CX.card + ' overflow-hidden" aria-label="' + esc(g.nombre) + '">' + head + body + '</section>';
}

function admChildRow(A, c, last, sibs, tmap, searching, pmap) {
  const meta = CLASE_META[c.clase] || CLASE_META.accion;
  const st = admItemStats(tmap.get(c.id) || []);
  const projs = (pmap && pmap.get(c.id)) || [];
  const idx = sibs.findIndex(x => x.id === c.id);
  const parts = [];
  // Los proyectos importados desde Cascade llevan el mismo nombre que el indicador: ese caso (casi todos) no se
  // muestra; sólo un proyecto con otro nombre, o varios, aportan algo (§14.4)
  const same = projs.length === 1 && normTxt(projs[0].nombre) === normTxt(c.nombre);
  if (projs.length && !same) {
    parts.push('<span class="inline-flex min-w-0 max-w-full items-center gap-1" title="' + esc(projs.map(p => p.nombre).join(' · ')) + '">' + icon('folder-kanban', 'size-3 shrink-0') +
      '<span class="truncate">' + esc(projs.length > 1 ? plural(projs.length, 'proyecto', 'proyectos') : projs[0].nombre) + '</span></span>');
  }
  // §14.4: tipo + proyecto + pendientes/atrasadas; sin «realizadas» ni última actividad (están en el panel)
  if (st.pending) parts.push('<span class="tabular-nums">' + esc(plural(st.pending, 'pendiente', 'pendientes')) + '</span>');
  if (st.overdue) parts.push('<span class="inline-flex items-center gap-1 font-medium text-red-600 dark:text-red-400">' + icon('triangle-alert', 'size-3') + esc(plural(st.overdue, 'atrasada', 'atrasadas')) + '</span>');

  const guide = '<span aria-hidden="true" class="pointer-events-none absolute left-[1.375rem] top-0 w-px bg-zinc-200 sm:left-[4.125rem] dark:bg-zinc-800 ' + (last ? 'h-1/2' : 'bottom-0') + '"></span>' +
    '<span aria-hidden="true" class="pointer-events-none absolute left-[1.375rem] top-1/2 h-px w-2.5 bg-zinc-200 sm:left-[4.125rem] dark:bg-zinc-800"></span>';

  const actions = '<div class="hidden shrink-0 items-center gap-0.5 transition-opacity sm:flex pointer-fine:opacity-0 pointer-fine:group-hover/row:opacity-100 pointer-fine:focus-within:opacity-100">' +
    btn({ label: 'Tarea', icon: 'plus', size: 'sm', variant: 'ghost', action: 'cascade.newTask', data: { id: c.id }, title: 'Nueva tarea vinculada a este indicador' }) +
    (searching ? '' :
      iconBtn({ icon: 'arrow-up', action: 'cascade.move', data: { id: c.id, dir: 'up' }, title: 'Subir', attrs: 'id="cas-up-' + esc(c.id) + '"' + (idx <= 0 ? ' disabled' : '') }) +
      iconBtn({ icon: 'arrow-down', action: 'cascade.move', data: { id: c.id, dir: 'down' }, title: 'Bajar', attrs: 'id="cas-dn-' + esc(c.id) + '"' + (idx < 0 || idx >= sibs.length - 1 ? ' disabled' : '') })) +
    iconBtn({ icon: 'pencil', action: 'cascade.edit', data: { id: c.id }, title: 'Editar indicador' }) +
    iconBtn({ icon: 'trash', action: 'cascade.delete', data: { id: c.id }, title: 'Eliminar indicador', variant: 'danger-ghost' }) +
    '</div>';

  return '<div class="group/row relative flex items-center gap-1 py-0.5 pl-9 pr-2 sm:pl-[4.75rem] sm:pr-3">' + guide +
    '<button type="button" id="cas-it-' + esc(c.id) + '" data-action="cascade.openItem" data-id="' + esc(c.id) + '" class="flex min-w-0 flex-1 items-center gap-3 rounded-lg px-2 py-2 text-left transition hover:bg-zinc-50 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500/60 dark:hover:bg-zinc-800/60">' +
    '<span class="grid size-8 shrink-0 place-items-center rounded-lg ' + tone(meta.tone).iconbox + '">' + icon(meta.icon, 'size-4') + '</span>' +
    '<span class="min-w-0 flex-1"><span class="line-clamp-2 break-words text-sm font-medium text-zinc-800 dark:text-zinc-100">' + admHl(c.nombre, A.casQ) + '</span>' +
    '<span class="mt-1 flex flex-wrap items-center gap-x-2.5 gap-y-1 text-xs text-zinc-500 dark:text-zinc-400">' + badge(meta.label, meta.tone) + parts.join('') + '</span></span>' +
    '<span class="shrink-0 text-zinc-300 sm:hidden dark:text-zinc-600">' + icon('chevron-right', 'size-4') + '</span>' +
    '</button>' + actions + '</div>';
}

/* ---------- Drawer de un indicador ---------- */
function admOpenItem(id) {
  openDrawer({ key: 'cascade:' + id, width: 'lg', render: () => admItemDrawer(id) });
}
// Punto de entrada para otros módulos (asistente, formularios de Gestión): abre el drawer del indicador
function openCascadeItem(id) { if (IDX.cascade && IDX.cascade.get(id)) admOpenItem(id); }
function admTaskList(list) {
  const row = t => typeof taskRow === 'function' ? taskRow(t, { showProject: true }) :
    '<button type="button" data-action="admin.openTask" data-id="' + esc(t.id) + '" class="flex w-full items-center gap-3 rounded-lg px-2 py-2 text-left transition hover:bg-zinc-100/70 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500/60 dark:hover:bg-zinc-800/50">' +
    avatar(t.resp, 'xs') + '<span class="min-w-0 flex-1 truncate text-sm text-zinc-800 dark:text-zinc-100">' + esc(t.nombre) + '</span>' + dueBadge(t) + '</button>';
  return '<div class="space-y-0.5 rounded-xl border border-zinc-200 bg-white p-1.5 sm:p-2 dark:border-zinc-800 dark:bg-zinc-900">' + list.map(row).join('') + '</div>';
}
function admProjectRow(p) {
  const P = PIL(p.pilar);
  return '<button type="button" data-action="admin.openProject" data-id="' + esc(p.id) + '" class="flex w-full items-center gap-3 rounded-lg px-2 py-2 text-left transition hover:bg-zinc-100/70 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500/60 dark:hover:bg-zinc-800/50">' +
    '<span class="grid size-7 shrink-0 place-items-center rounded-md ' + (P ? P.tone.iconbox : tone('violet').iconbox) + '">' + icon('folder-kanban', 'size-3.5') + '</span>' +
    '<span class="min-w-0 flex-1 truncate text-sm font-medium text-zinc-800 dark:text-zinc-100">' + esc(p.nombre) + '</span>' +
    (p.estado && p.estado !== 'Activo' ? badge(p.estado, 'zinc') : '') + avatar(p.resp, 'xs') + '</button>';
}
function admItemDrawer(id) {
  const it = IDX.cascade.get(id);
  if (!it) return null;
  const meta = CLASE_META[it.clase] || CLASE_META.accion;
  const g = it.padre ? IDX.cascade.get(it.padre) : null;
  const list = (S.tasks || []).filter(t => t.cascade === id);
  const projs = (S.projects || []).filter(p => p.cascade === id);
  const pend = list.filter(t => t.estado !== 'Realizada').sort((a, b) => (a.fecha || '9999-99-99').localeCompare(b.fecha || '9999-99-99'));
  const done = list.filter(t => t.estado === 'Realizada').sort((a, b) => (b.completada || '').localeCompare(a.completada || ''));
  const sibs = admSiblings(it);
  const idx = sibs.findIndex(x => x.id === id);
  const sec = (title, ic, inner) => '<div class="mt-5 first:mt-0">' + sectionHeader({ title: title, icon: ic }) + inner + '</div>';

  // §14.4: sin tarjetas de cifras ni conteos en los títulos; las listas ya lo dicen
  let body = '';
  if (g) {
    body += '<p class="mb-5 flex min-w-0 flex-wrap items-center gap-x-2 gap-y-1 text-sm text-zinc-600 dark:text-zinc-300">' + icon('target', 'size-4 shrink-0 text-violet-500 dark:text-violet-400') +
      '<span class="min-w-0 break-words font-medium text-zinc-900 dark:text-zinc-100">' + esc(g.nombre) + '</span>' + admEtqTag(g.etiqueta) + '</p>';
  }
  if (projs.length) {
    body += sec(projs.length === 1 ? 'Proyecto' : 'Proyectos', 'folder-kanban',
      '<div class="space-y-0.5 rounded-xl border border-zinc-200 bg-white p-1.5 sm:p-2 dark:border-zinc-800 dark:bg-zinc-900">' + projs.map(admProjectRow).join('') + '</div>');
  }
  body += sec('Pendientes', 'circle-dot', pend.length ? admTaskList(pend) : '<p class="px-1 text-sm text-zinc-500 dark:text-zinc-400">Sin pendientes.</p>');
  if (done.length) body += sec('Realizadas', 'circle-check', admTaskList(done));

  const footer = '<div class="mr-auto flex items-center gap-0.5">' +
    iconBtn({ icon: 'arrow-up', action: 'cascade.move', data: { id: id, dir: 'up' }, title: 'Subir en el grupo', attrs: 'id="casd-up-' + esc(id) + '"' + (idx <= 0 ? ' disabled' : '') }) +
    iconBtn({ icon: 'arrow-down', action: 'cascade.move', data: { id: id, dir: 'down' }, title: 'Bajar en el grupo', attrs: 'id="casd-dn-' + esc(id) + '"' + (idx < 0 || idx >= sibs.length - 1 ? ' disabled' : '') }) +
    iconBtn({ icon: 'trash', action: 'cascade.delete', data: { id: id }, title: 'Eliminar indicador', variant: 'danger-ghost' }) + '</div>' +
    btn({ label: 'Editar', icon: 'pencil', variant: 'secondary', action: 'cascade.edit', data: { id: id } }) +
    btn({ label: 'Nueva tarea', icon: 'plus', variant: 'primary', action: 'cascade.newTask', data: { id: id } });

  return {
    title: it.nombre,
    subtitle: pillarBadge(it.pilar) + badge(meta.label, meta.tone, meta.icon),
    iconHtml: '<span class="grid size-10 shrink-0 place-items-center rounded-xl ' + tone(meta.tone).iconbox + '">' + icon(meta.icon, 'size-5') + '</span>',
    body: body,
    footer: footer,
  };
}

/* ---------- Formularios (modales) ---------- */
function admBindSave(el, submit) {
  const b = el.querySelector('[data-adm-save]');
  if (b) b.addEventListener('click', submit);
  el.querySelectorAll('input[type="text"]').forEach(i => i.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); submit(); }
  }));
}
function admSaving(el, on) {
  const b = el.querySelector('[data-adm-save]');
  if (!b) return;
  b.disabled = on;
  b.innerHTML = on ? icon('loader-circle', 'size-4 shrink-0 animate-spin') + '<span>Guardando…</span>' : icon('check', 'size-4 shrink-0') + '<span>Guardar</span>';
  refreshIcons(b);
}
function admFormFooter() {
  return btn({ label: 'Cancelar', variant: 'secondary', action: 'modal.close' }) +
    btn({ label: 'Guardar', icon: 'check', variant: 'primary', attrs: 'data-adm-save="1"' });
}

function admGroupForm(id) {
  const A = admState();
  const g = id ? IDX.cascade.get(id) : null;
  const etq = g ? String(g.etiqueta || '').trim() : 'Iniciativa';
  const known = !etq || etq === '—' || ADM_ETIQUETAS.indexOf(etq) >= 0;
  const selVal = known ? (etq === '—' ? '' : etq) : '__otra';

/* ---------- Reordenar (intercambia 'orden' con el vecino) ---------- */
function admMove(id, dir) {
  const A = admState();
  if (A.busy.move) return;
  const it = IDX.cascade.get(id); if (!it) return;
  const sibs = admSiblings(it);
  const i = sibs.findIndex(x => x.id === id), j = dir === 'up' ? i - 1 : i + 1;
  if (i < 0 || j < 0 || j >= sibs.length) return;
  const ords = sibs.map(x => Number(x.orden) || 0);
  const distinct = new Set(ords).size === ords.length;
  let saves;
  if (distinct) {
    saves = [admEnt(sibs[i], { orden: ords[j] }), admEnt(sibs[j], { orden: ords[i] })];
  } else {
    // Órdenes repetidos: se renumera el grupo completo (sólo una vez)
    const order = sibs.slice(); const tmp = order[i]; order[i] = order[j]; order[j] = tmp;
    saves = order.map((x, k) => ({ x: x, o: (k + 1) * 10 })).filter(z => (Number(z.x.orden) || 0) !== z.o).map(z => admEnt(z.x, { orden: z.o }));
  }
  A.busy.move = true;
  // Si se usó el teclado, se mantiene el foco en las flechas del mismo indicador
  const ae = document.activeElement;
  const pre = ae && ae.id && /^casd?-(up|dn)-/.test(ae.id) ? ae.id.slice(0, ae.id.indexOf('-') + 1) : '';
  const step = k => {
    if (k >= saves.length) return Promise.resolve(true);
    const last = k === saves.length - 1;
    return mutate('gSave', [saves[k]], { silent: !last, success: 'Orden actualizado' }).then(b => b ? step(k + 1) : false);
  };
  step(0).then(ok => {
    if (!ok || !pre) return;
    const cur = document.activeElement;
    if (cur && cur !== document.body && cur.id) return;
    const a = document.getElementById(pre + (dir === 'up' ? 'up-' : 'dn-') + id), b = document.getElementById(pre + (dir === 'up' ? 'dn-' : 'up-') + id);
    const el = a && !a.disabled ? a : (b && !b.disabled ? b : null);
    if (el) el.focus({ preventScroll: true });
  }).finally(() => { A.busy.move = false; });
}

/* ---------- Eliminar ---------- */
function admDelete(id) {
  const it = IDX.cascade.get(id); if (!it) return;
  if (!it.padre) {
    const n = (IDX.cascadeChildren.get(id) || []).length;
    if (n) { toast('Elimina primero sus indicadores: este grupo tiene ' + plural(n, 'indicador', 'indicadores') + '.', 'error'); return; }
  }
  const nT = (S.tasks || []).filter(t => t.cascade === id).length;
  const nP = (S.projects || []).filter(p => p.cascade === id).length;
  const linked = [nT ? plural(nT, 'tarea', 'tareas') : '', nP ? plural(nP, 'proyecto', 'proyectos') : ''].filter(Boolean).join(' y ');
  confirmDialog({
    title: it.padre ? '¿Eliminar indicador?' : '¿Eliminar grupo?',
    message: '«' + it.nombre + '» se quitará del catálogo. ' + (linked ? 'Quedarán sin indicador: ' + linked + '. ' : '') + 'Esta acción no se puede deshacer.',
    confirmLabel: 'Eliminar', danger: true,

}

function admKind(accion) {
  const a = normTxt(accion);

  if (/elimin|borr|quit|remov/.test(a)) return 'delete';
  if (/coment/.test(a)) return 'comment';
  if (/complet|realiz|cerr|termin|finaliz/.test(a)) return 'complete';
  if (/crea|agreg|nuev|alta|anad/.test(a)) return 'create';
  if (/edit|actualiz|modific|cambi|mov|reabr|reorden|vincul|recalc|instal|config|guard|orden/.test(a)) return 'edit';
  return 'other';
}

  if (ctx && ctx.animate && Date.now() - (A.histAt || 0) > 60000) admLoadHist(true);
}

// Pestañas «Cuadre AAAA» omitidas por encabezados incompletos (bundle.config.warnings: 'Se omitió la pestaña "X": …')
function admSkippedTabs() {
  const out = [];
  ((S.config && S.config.warnings) || []).forEach(w => {
    const m = String(w || '').match(/^Se omitió la pestaña "([^"]+)"/);
    if (m && out.indexOf(m[1]) < 0) out.push(m[1]);

  return out;
}

  }
  return admSetCard({

/* ---------- Proyectos desde Cascade (administración) ---------- */
// Misma regla que importCascadeProjects (SPEC §13.1), sólo para mostrar cuánto falta; el servidor decide.
function admCascadeImportPreview() {
  const projCas = new Set((S.projects || []).map(p => p.cascade).filter(Boolean));
  const taskCas = new Set((S.tasks || []).map(t => t.cascade).filter(Boolean));
  const out = { projects: 0, tasks: 0 };
  Object.keys(IDX.cascadeGroups || {}).forEach(k => (IDX.cascadeGroups[k] || []).forEach(g => {
    const kids = IDX.cascadeChildren.get(g.id) || [];
    const acts = kids.filter(c => c.clase === 'accion' || c.clase === 'objetivo');
    if (acts.length) { acts.forEach(c => { if (!projCas.has(c.id)) out.projects++; }); return; }
    if (!projCas.has(g.id)) out.projects++;
    kids.forEach(c => { if (c.clase === 'hito' && !taskCas.has(c.id)) out.tasks++; });
  }));
  return out;
}
function admImportText(np, nt) {
  return [np ? plural(np, 'proyecto nuevo', 'proyectos nuevos') : '', nt ? plural(nt, 'tarea nueva', 'tareas nuevas') : ''].filter(Boolean).join(' y ');
}
function admCascadeImportCard() {
  const A = admState();
  const pv = admCascadeImportPreview();
  const linked = (S.projects || []).filter(p => p.cascade && IDX.cascade.has(p.cascade)).length;
  const todo = pv.projects + pv.tasks;
  const li = A.lastImport;
  let body = '<p class="text-sm leading-relaxed text-zinc-600 dark:text-zinc-300">Cada acción u objetivo de Cascade se vuelve un proyecto; no se duplica nada.</p>' +
    '<div class="mt-4">' + admDl([

      ['Por importar', todo ? '<span class="tabular-nums">' + esc([plural(pv.projects, 'proyecto', 'proyectos'), pv.tasks ? plural(pv.tasks, 'hito', 'hitos') : ''].filter(Boolean).join(' · ')) + '</span>'
        : badge('Al día', 'emerald', 'circle-check')],
    ]) + '</div>';
  if (li) {
    body += '<p class="mt-3 flex items-center gap-1.5 text-xs text-zinc-500 dark:text-zinc-400">' + icon('circle-check', 'size-3.5 shrink-0 text-emerald-500') +
      esc('Última importación: ' + (li.projects || li.tasks ? admImportText(li.projects, li.tasks) : 'todo estaba al día') + '.') + '</p>';

  const footer = btn({ label: 'Ver catálogo', icon: 'target', variant: 'ghost', href: '#/cascade' }) +

/* ---------- Solicitudes de compra de Ariba (administración) ---------- */
// getAdminStatus().aprob = {triggerInstalled, lastScan ISO, lastResult, sender, minutes} (Aprobaciones.gs · aprobStatus_)
// lastResult = {found, added, updated, …} o {error, at} si no se pudo leer Gmail
function admAprobResult(r) {
  if (r == null || r === '') return '';
  if (typeof r !== 'object') return esc(String(r));
  if (r.error) return '<span class="break-words font-normal text-amber-700 dark:text-amber-400">' + esc('No se pudo leer Gmail: ' + r.error) + '</span>';
  const added = Number(r.added) || 0, updated = Number(r.updated) || 0, found = Number(r.found) || 0;
  const parts = [added ? plural(added, 'nueva', 'nuevas') : '', updated ? plural(updated, 'actualizada', 'actualizadas') : ''].filter(Boolean);
  return esc(parts.length ? parts.join(' · ') : found ? 'Sin novedades · ' + plural(found, 'correo revisado', 'correos revisados') : 'Sin correos nuevos');
}
function admScanText(ls) {
  const added = Number(ls && ls.added) || 0, updated = Number(ls && ls.updated) || 0, found = Number(ls && ls.found) || 0;
  if (added || updated) {
    return 'Listo: ' + [added ? plural(added, 'solicitud nueva', 'solicitudes nuevas') : '', updated ? plural(updated, 'actualizada', 'actualizadas') : ''].filter(Boolean).join(' y ');
  }
  return found ? 'Todo al día: ' + plural(found, 'correo revisado', 'correos revisados') + ', sin novedades' : 'Todo al día: no hay solicitudes nuevas';
}
function admAribaCard() {
  if (!admFeature('gmail')) return admSafeCard('ariba', 'inbox', 'Solicitudes de compra (Ariba)', 'Gmail');
  const A = admState();
  const st = A.status;
  const ap = st && st.aprob && typeof st.aprob === 'object' ? st.aprob : null;
  const installed = !!(ap && ap.triggerInstalled);
  const pend = (S.solicitudes || []).filter(x => x && x.estado === 'Pendiente').length;
  let status;
  if (ap) {
    const hr = ap.hour != null ? Number(ap.hour) : null;
    status = installed ? badge('Automática · a diario' + (hr != null && isFinite(hr) ? ' ~' + hr + ':00' : ''), 'emerald', 'circle-check') : badge('Sólo manual', 'zinc', 'circle-pause');
  } else if (A.statusErr) status = '<span class="text-xs text-red-600 dark:text-red-400">No se pudo leer el estado</span>';
  else if (st) status = badge('No disponible', 'zinc');
  else status = '<div class="skeleton h-5 w-28 rounded-md"></div>';
  const rows = [['Revisión', status]];
  if (ap) {
    const last = ap.lastScan ? new Date(ap.lastScan) : null;
    const ok = last && !isNaN(last.getTime());
    rows.push(['Última revisión', ok ? '<span title="' + esc(fmtDateTime(last)) + '">' + esc(fmtRel(last)) + '</span>' : '<span class="font-normal text-zinc-500 dark:text-zinc-400">Aún no se revisa</span>']);
    const res = admAprobResult(ap.lastResult);
    if (res) rows.push(['Resultado', res]);
  }
  rows.push(['Por registrar', pend ? '<a href="#/presupuesto/solicitudes" class="inline-flex items-center gap-1 text-indigo-600 hover:text-indigo-500 dark:text-indigo-400">' +
    esc(plural(pend, 'solicitud', 'solicitudes')) + icon('arrow-right', 'size-3.5 shrink-0') + '</a>' : '<span class="tabular-nums">0</span>']);
  const sender = ap && ap.sender ? admCode(ap.sender) : 'el remitente de Ariba';
  // Una sola nota: qué se lee de Gmail y que la aprobación sigue en el mismo correo
  const body = admDl(rows) +
    '<p class="mt-4 flex gap-2 text-xs leading-relaxed text-zinc-500 dark:text-zinc-400">' + icon('mail-search', 'mt-0.5 size-3.5 shrink-0 text-zinc-400') +
    '<span class="min-w-0 break-words"><b class="font-medium text-zinc-700 dark:text-zinc-200">Permiso de Gmail:</b> sólo se leen los correos de ' + sender + '; la aprobación la sigues haciendo en el mismo correo.</span></p>';
  // Servidor sin el módulo de Ariba (getAdminStatus sin «aprob»): no se ofrecen botones que fallarían
  const footer = st && !ap ? '' :
    (A.busy.aprobScan ? admSpin('Revisando…') : btn({ label: 'Revisar ahora', icon: 'refresh-cw', variant: installed ? 'primary' : 'secondary', action: 'admin.aprobScan' })) +
    (installed ? '' : A.busy.aprobInstall ? admSpin('Activando…') : btn({ label: 'Activar revisión automática', icon: 'timer', variant: 'primary', action: 'admin.aprobInstall' }));
  return admSetCard({
    key: 'ariba', icon: 'inbox', tone: 'indigo', title: 'Solicitudes de compra (Ariba)',
    right: A.statusErr ? iconBtn({ icon: 'refresh-cw', action: 'admin.statusReload', title: 'Reintentar' }) : '',
    body: body, footer: footer,
  });
}

function admSettingsMount(root, params, ctx) {
  const A = admState();
  const inp = root.querySelector('#' + ADM_APPURL_ID);
  if (inp) inp.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); dispatch('admin.saveAppUrl', inp, e); }
  });
  if (admIsAdmin() && !A.drive && !A.driveErr) admLoadDrive(false);
  if (A.statusLoading) return;
  if (!A.status && !A.statusErr) { admLoadStatus(false); return; }
  if (ctx && ctx.animate && A.status && Date.now() - (A.statusAt || 0) > 120000) admLoadStatus(true);
}

  if (!admIsAdmin() || A.busy.aprobScan) return;
  A.busy.aprobScan = true; rerender();
  mutate('aprobScan', [], { silent: true }).then(b => {
    if (!b || b.stale) return;
    if (b.aprob && A.status) A.status.aprob = b.aprob;
    toast(admScanText(b.lastScan), 'success');
    admLoadStatus(true);
  }).finally(() => { A.busy.aprobScan = false; admRerenderIf('settings'); });
});

action('admin.viewAs', () => {
  if (!admRealAdmin()) return;
  const on = !admIsAdmin();
  if (typeof setAdminView === 'function') setAdminView(on);
  else { LS.set('adminView', on); renderShell(); rerender(); }
  toast(on ? 'Vista de administración' : 'Ahora ves la app como el equipo', 'info');
});
action('admin.driveReload', () => { const A = admState(); A.driveErr = ''; admLoadDrive(true); rerender(); });
action('admin.driveEdit', () => {
  const A = admState();
  if (!admIsAdmin()) return;
  A.driveEdit = true; rerender();
  const el = document.getElementById(ADM_DRIVE_ID);
  if (el) el.focus();
});
action('admin.driveDisconnect', () => {
  confirmDialog({ title: '¿Desconectar la carpeta de Drive?', message: 'La app deja de crear carpetas y de mostrar archivos. Las carpetas y archivos que ya existen en Drive no se tocan.', confirmLabel: 'Desconectar', danger: true })
    .then(ok => {
      if (!ok) return;
      run('driveSetRoot', ['']).then(() => { toast('Carpeta de Drive desconectada', 'success'); refreshData(true); const A = admState(); A.drive = null; A.driveEdit = false; admLoadDrive(true); rerender(); })
        .catch(e => toast(errMsg(e), 'error'));
    });
});
action('admin.driveCancel', () => { const A = admState(); if (A.busy.driveRoot) return; A.driveEdit = false; rerender(); });
action('admin.driveSave', () => {
  const A = admState();
  if (!admIsAdmin() || A.busy.driveRoot) return;
  const inp = document.getElementById(ADM_DRIVE_ID);
  const v = String((inp && inp.value) || '').trim();
  if (!v) { toast('Pega el link de la carpeta de la unidad compartida', 'info'); if (inp) inp.focus(); return; }
  A.busy.driveRoot = true; rerender();
  run('driveSetRoot', v).then(r => {
    if (!r || r.ok === false || !r.root) { toast('No se pudo guardar la carpeta', 'error'); return; }
    A.drive = Object.assign({}, A.drive || {}, { configured: true, root: r.root });
    A.driveEdit = false;
    const el = document.getElementById(ADM_DRIVE_ID);
    if (el) el.value = el.defaultValue;
    toast('Carpeta raíz guardada' + (r.root.name ? ': ' + r.root.name : ''), 'success');
    admLoadDrive(true);
  }).catch(e => toast(errMsg(e), 'error'))   // se conserva lo escrito
    .finally(() => { A.busy.driveRoot = false; admRerenderIf('settings'); });
});
// Texto y tono del aviso después de «Crear carpetas que faltan»
function admDriveCreateMsg(r) {
  r = r || {};
  const n = k => Number(r[k]) || 0;
  const created = n('created'), linked = n('linked'), total = n('total'), remaining = n('remaining'), failed = n('failed');
  const errs = Array.isArray(r.errors) ? r.errors.filter(Boolean) : [];
  if (!created && !linked && !failed && !remaining) {
    return { text: total ? 'No faltaba ninguna: ' + plural(total, 'proyecto', 'proyectos') + ' con carpeta' : 'Aún no hay proyectos', type: 'success' };
  }
  const parts = [created ? plural(created, 'carpeta creada', 'carpetas creadas') : '', linked ? plural(linked, 'vinculada', 'vinculadas') : ''].filter(Boolean);
  let text = parts.length ? 'Listo: ' + parts.join(' y ') + (total ? ' (de ' + plural(total, 'proyecto', 'proyectos') + ')' : '') : '';
  if (failed) text += (text ? ' · ' : '') + plural(failed, 'con error', 'con error') + (errs.length ? ': ' + errs[0] : '');
  if (remaining > failed) text += (text ? ' · ' : '') + 'faltan ' + (remaining - failed) + ': vuelve a apretar el botón';
  return { text: text, type: failed && !parts.length ? 'error' : failed || remaining > failed ? 'info' : 'success' };
}
action('admin.driveCreate', () => {
  const A = admState();
  if (!admIsAdmin() || A.busy.driveCreate) return;
  if (!(A.drive && A.drive.configured)) { toast('Primero guarda la carpeta raíz', 'info'); return; }
  A.busy.driveCreate = true; rerender();
  run('driveCreateMissing').then(r => {
    const m = admDriveCreateMsg(r);
    toast(m.text, m.type);
    if (r && (Number(r.created) || Number(r.linked)) && typeof refreshData === 'function') refreshData(true);   // trae Project.carpeta
  }).catch(e => toast(errMsg(e), 'error'))
    .finally(() => { A.busy.driveCreate = false; admRerenderIf('settings'); });
});

registerView('settings', { title: 'Ajustes', render: admSettingsView, mount: admSettingsMount });
</script>
