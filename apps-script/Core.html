<script>

/* ---------- Preferencias locales (siempre con try/catch) ---------- */
const LS = {
  get(k, d) { try { const v = localStorage.getItem('aacc.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('aacc.' + k, JSON.stringify(v)); } catch (e) {} },

/* ---------- Formato ---------- */
const MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const MESES_LARGO = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function safeUrl(u) {
  const s = String(u || '').trim();
  return /^https?:\/\/[^\s"'<>]+$/i.test(s) ? s : '';
}
function fmtNum(n) { return Math.round(Number(n) || 0).toLocaleString('es-CL'); }
function fmtMoney(n) { return '$' + fmtNum(n); }
function fmtCompact(n) {
  const v = Number(n) || 0, a = Math.abs(v);
  if (a >= 1e9) return '$' + (v / 1e9).toLocaleString('es-CL', { maximumFractionDigits: 1 }) + ' MM';
  if (a >= 1e6) return '$' + (v / 1e6).toLocaleString('es-CL', { maximumFractionDigits: 1 }) + ' M';
  if (a >= 1e3) return '$' + (v / 1e3).toLocaleString('es-CL', { maximumFractionDigits: 0 }) + ' mil';
  return fmtMoney(v);
}
// Pesos enteros. Un decimal final con coma ("$1.500.000,00" pegado desde Excel) se descarta, no se suma como dígitos.
function parseMoney(s) { return parseInt(String(s == null ? '' : s).replace(/,\d{1,2}\s*$/, '').replace(/[^0-9]/g, ''), 10) || 0; }
// Reformatea un campo de dinero mientras se escribe sin mandar el cursor al final.
function fmtMoneyInput(m) {
  const raw = m.value;
  const v = parseMoney(raw), out = v ? fmtNum(v) : '';
  if (out === raw) return;
  let pos = null;
  try { pos = m.selectionStart; } catch (e) { pos = null; }
  let digits = pos == null ? -1 : raw.slice(0, pos).replace(/\D/g, '').replace(/^0+/, '').length;
  m.value = out;
  if (digits < 0 || document.activeElement !== m) return;
  let i = 0;
  while (i < out.length && digits > 0) { if (/\d/.test(out[i])) digits--; i++; }
  try { m.setSelectionRange(i, i); } catch (e) {}
}
function pad2(n) { return ('0' + n).slice(-2); }
function ymd(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function todayStr() { return ymd(new Date()); }
function parseYmd(s) { const m = String(s || '').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; }
function addDays(s, n) { const d = parseYmd(s) || new Date(); d.setDate(d.getDate() + n); return ymd(d); }
function daysUntil(s) {
  const d = parseYmd(s); if (!d) return null;
  const t = new Date(); return Math.round((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - Date.UTC(t.getFullYear(), t.getMonth(), t.getDate())) / 86400000);
}
function fmtDate(s) { const d = parseYmd(s); return d ? d.getDate() + ' ' + MESES[d.getMonth()] + ' ' + d.getFullYear() : '—'; }
function fmtDateShort(s) { const d = parseYmd(s); return d ? d.getDate() + ' ' + MESES[d.getMonth()] : '—'; }
function fmtRel(v) {
  if (!v) return '';
  const d = v instanceof Date ? v : new Date(v);
  if (isNaN(d.getTime())) return '';
  const min = Math.round((Date.now() - d.getTime()) / 60000);
  if (min < 1) return 'ahora';
  if (min < 60) return 'hace ' + min + ' min';
  const h = Math.round(min / 60);
  if (h < 24) return 'hace ' + h + ' h';
  const days = -daysUntil(ymd(d));
  if (days === 1) return 'ayer';
  if (days < 7) return 'hace ' + days + ' días';
  return d.getDate() + ' ' + MESES[d.getMonth()] + (d.getFullYear() !== new Date().getFullYear() ? ' ' + d.getFullYear() : '');
}
function fmtDateTime(v) {
  const d = new Date(v); if (isNaN(d.getTime())) return '';
  return d.getDate() + ' ' + MESES[d.getMonth()] + ' ' + d.getFullYear() + ', ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
}
function pct(a, b) { return b > 0 ? Math.max(0, Math.min(100, Math.round(a / b * 100))) : 0; }
function plural(n, one, many) { return n + ' ' + (n === 1 ? one : many); }
function initials(name) { return String(name || '?').split(/[\s@.]+/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join(''); }
function normTxt(s) { return String(s == null ? '' : s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim(); }
function debounce(fn, ms) { let t; return function () { const a = arguments, self = this; clearTimeout(t); t = setTimeout(() => fn.apply(self, a), ms); }; }
function kebab(k) { return String(k).replace(/[A-Z]/g, c => '-' + c.toLowerCase()); }
function dataAttrs(data) { return Object.entries(data || {}).filter(([, v]) => v != null).map(([k, v]) => ' data-' + kebab(k) + '="' + esc(v) + '"').join(''); }
function shortUrl(u) {
  try { const x = new URL(u); const p = (x.pathname || '').replace(/\/$/, ''); return x.host.replace(/^www\./, '') + (p.length > 24 ? p.slice(0, 24) + '…' : p); } catch (e) { return String(u).slice(0, 40); }
}
function linkify(text) {
  return esc(text).replace(/(https?:\/\/[^\s<]+[^\s<.,;:!?)\]'"])/g, m => {
    const raw = m.replace(/&amp;/g, '&');
    return '<a href="' + esc(raw) + '" target="_blank" rel="noopener noreferrer" class="font-medium text-indigo-600 underline decoration-indigo-300 underline-offset-2 hover:text-indigo-500 dark:text-indigo-400 dark:decoration-indigo-500/40">' + esc(shortUrl(raw)) + '</a>';
  });
}

  emerald: { soft: 'bg-emerald-50 text-emerald-700 ring-emerald-600/20 dark:bg-emerald-500/10 dark:text-emerald-300 dark:ring-emerald-400/25', solid: 'bg-emerald-500', text: 'text-emerald-700 dark:text-emerald-400', iconbox: 'bg-emerald-50 text-emerald-600 dark:bg-emerald-500/15 dark:text-emerald-300', border: 'border-emerald-200 dark:border-emerald-500/30', dot: 'bg-emerald-500' },
  sky: { soft: 'bg-sky-50 text-sky-700 ring-sky-600/20 dark:bg-sky-500/10 dark:text-sky-300 dark:ring-sky-400/25', solid: 'bg-sky-500', text: 'text-sky-700 dark:text-sky-400', iconbox: 'bg-sky-50 text-sky-600 dark:bg-sky-500/15 dark:text-sky-300', border: 'border-sky-200 dark:border-sky-500/30', dot: 'bg-sky-500' },
  indigo: { soft: 'bg-indigo-50 text-indigo-700 ring-indigo-600/20 dark:bg-indigo-500/10 dark:text-indigo-300 dark:ring-indigo-400/25', solid: 'bg-indigo-500', text: 'text-indigo-600 dark:text-indigo-400', iconbox: 'bg-indigo-50 text-indigo-600 dark:bg-indigo-500/15 dark:text-indigo-300', border: 'border-indigo-200 dark:border-indigo-500/30', dot: 'bg-indigo-500' },
  violet: { soft: 'bg-violet-50 text-violet-700 ring-violet-600/20 dark:bg-violet-500/10 dark:text-violet-300 dark:ring-violet-400/25', solid: 'bg-violet-500', text: 'text-violet-700 dark:text-violet-400', iconbox: 'bg-violet-50 text-violet-600 dark:bg-violet-500/15 dark:text-violet-300', border: 'border-violet-200 dark:border-violet-500/30', dot: 'bg-violet-500' },

const BTN_VARIANTS = {

  secondary: 'bg-white text-zinc-800 shadow-sm ring-1 ring-inset ring-zinc-300 hover:bg-zinc-50 dark:bg-zinc-800 dark:text-zinc-100 dark:ring-zinc-700 dark:hover:bg-zinc-700/80',

  danger: 'bg-red-600 text-white shadow-sm hover:bg-red-500',

function btn(o) {

  const inner = (o.icon ? icon(o.icon, o.size === 'sm' ? 'size-3.5 shrink-0' : 'size-4 shrink-0') : '') + (o.label ? '<span>' + esc(o.label) + '</span>' : '');
  const common = (o.action ? ' data-action="' + esc(o.action) + '"' : '') + dataAttrs(o.data) + (o.title ? ' title="' + esc(o.title) + '" aria-label="' + esc(o.title) + '"' : '') + (o.attrs ? ' ' + o.attrs : '');
  if (o.href) return '<a href="' + esc(o.href) + '" class="' + cls + '"' + common + (o.external ? ' target="_blank" rel="noopener noreferrer"' : '') + '>' + inner + '</a>';
  return '<button type="' + (o.type || 'button') + '" class="' + cls + '"' + common + (o.disabled ? ' disabled' : '') + '>' + inner + '</button>';
}
function iconBtn(o) {
  o = o || {};
  const cls = 'inline-grid size-8 shrink-0 place-items-center rounded-lg transition focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500/60 disabled:opacity-40 ' + (BTN_VARIANTS[o.variant || 'ghost'] || BTN_VARIANTS.ghost) + ' ' + (o.cls || '');
  const common = (o.action ? ' data-action="' + esc(o.action) + '"' : '') + dataAttrs(o.data) + ' title="' + esc(o.title || '') + '" aria-label="' + esc(o.title || '') + '"' + (o.attrs ? ' ' + o.attrs : '');
  if (o.href) return '<a href="' + esc(o.href) + '" class="' + cls + '"' + common + (o.external ? ' target="_blank" rel="noopener noreferrer"' : '') + '>' + icon(o.icon, 'size-4') + '</a>';
  return '<button type="button" class="' + cls + '"' + common + (o.disabled ? ' disabled' : '') + '>' + icon(o.icon, 'size-4') + '</button>';
}
function card(inner, cls) { return '<div class="' + CX.card + ' ' + (cls || '') + '">' + inner + '</div>'; }

function statCard(o) {
  const t = tone(o.tone || 'zinc');
  const isNum = typeof o.value === 'number';
  const shown = isNum ? (o.money ? fmtMoney(o.value) : fmtNum(o.value)) : esc(o.value);
  return '<div class="' + CX.card + ' lift p-4 ' + (o.animate === false ? '' : 'anim-slide-up ') + (o.cls || '') + '">' +

}
function progress(p, t, cls) {
  return '<div class="h-1.5 w-full overflow-hidden rounded-full bg-zinc-100 dark:bg-zinc-800 ' + (cls || '') + '"><div class="bar-grow h-full rounded-full ' + tone(t || 'indigo').solid + '" style="width:' + Math.max(0, Math.min(100, p || 0)) + '%"></div></div>';
}
function stackBar(segs, cls) {
  const tot = segs.reduce((a, s) => a + Math.max(s.value, 0), 0) || 1;
  return '<div class="flex h-2.5 w-full overflow-hidden rounded-full bg-zinc-100 dark:bg-zinc-800 ' + (cls || '') + '">' +
    segs.filter(s => s.value > 0).map(s => '<div class="bar-grow h-full ' + tone(s.tone).solid + '" style="width:' + (s.value / tot * 100).toFixed(2) + '%" title="' + esc((s.label || '') + ': ' + fmtMoney(s.value)) + '"></div>').join('') + '</div>';
}
function emptyState(o) {
  o = o || {};
  return '<div class="flex flex-col items-center justify-center px-6 py-12 text-center anim-fade-in">' +
    '<div class="grid size-12 place-items-center rounded-2xl bg-zinc-100 text-zinc-400 dark:bg-zinc-800 dark:text-zinc-500">' + icon(o.icon || 'inbox', 'size-6') + '</div>' +
    '<p class="mt-4 text-sm font-semibold text-zinc-900 dark:text-zinc-100">' + esc(o.title || 'Sin datos') + '</p>' +
    (o.text ? '<p class="mt-1 max-w-sm text-sm text-zinc-500 dark:text-zinc-400">' + esc(o.text) + '</p>' : '') +
    (o.actionHtml ? '<div class="mt-5">' + o.actionHtml + '</div>' : '') + '</div>';
}
function skeleton(n) {
  let h = '';

  return '<div class="space-y-3">' + h + '</div>';
}
function segmented(o) {

  }).join('') + '</div>';
}
function tabs(o) {

function searchInput(o) {

function sectionHeader(o) {
  return '<div class="mb-3 flex flex-wrap items-center justify-between gap-2"><div class="flex min-w-0 items-center gap-2">' +
    (o.icon ? icon(o.icon, 'size-4 text-zinc-400') : '') + '<h2 class="truncate text-sm font-semibold text-zinc-900 dark:text-zinc-100">' + esc(o.title) + '</h2>' +

/* ---------- Formularios ---------- */
function field(o) {

  if (ev.key === 'Escape') {
    if (MODALS.length) { ev.preventDefault(); closeTopModal(); return; }
    if (DRAWER) { ev.preventDefault(); closeDrawer(); return; }
  }
  if ((ev.metaKey || ev.ctrlKey) && (ev.key === 'k' || ev.key === 'K')) { ev.preventDefault(); if (ACTIONS['assistant.open']) dispatch('assistant.open', document.body, ev); return; }
  if (!typing && ev.key === '/' && ACTIONS['assistant.open']) { ev.preventDefault(); dispatch('assistant.open', document.body, ev); return; }
  if (t && t.dataset && t.dataset.commentInput && ev.key === 'Enter' && (ev.metaKey || ev.ctrlKey)) { ev.preventDefault(); dispatch('comment.add', { dataset: { ref: t.dataset.commentInput } }, ev); return; }
  if (t && t.dataset && t.dataset.enter && ev.key === 'Enter' && !ev.shiftKey && !ev.isComposing) { ev.preventDefault(); dispatch(t.dataset.enter, t, ev); }
});
window.addEventListener('hashchange', onRoute);

/* ---------- Arranque ---------- */
function bootError(e) {
  const v = document.getElementById('view');
  v.innerHTML = '<div class="mx-auto max-w-lg px-4 py-20">' + card('<div class="p-6">' + emptyState({
    icon: 'cloud-off', title: 'No se pudieron cargar los datos', text: errMsg(e),
    actionHtml: btn({ label: 'Reintentar', icon: 'refresh-cw', variant: 'primary', action: 'app.retry' }) +
      '<p class="mx-auto mt-4 max-w-sm text-xs text-zinc-500 dark:text-zinc-400">Si persiste, abre la app sólo con tu cuenta @copec.cl (ventana de incógnito o un perfil de Chrome aparte).</p>',
  }) + '</div>') + '</div>';
  refreshIcons();
}
// Carga inicial de datos (también la usa "Reintentar": recargar el iframe de Apps Script lo deja en blanco).
function loadApp(pre) {
  const cached = !S ? readBundleCache() : null;
  if (cached) {
    // Se muestra lo último conocido mientras llegan los datos frescos (los cambios igual se validan en el servidor).
    Promise.resolve(pre).then(() => {
      if (S && !S.fromCache) return;
      applyBundle(cached);
      document.getElementById('app').classList.remove('is-booting');
      onRoute();
    });
  }
  return Promise.all([run('bootstrap'), pre]).then(res => {
    const first = !S || S.fromCache;
    if (S && S.fromCache) S.loadedAt = ''; // el bundle fresco siempre reemplaza al del caché
    applyBundle(res[0]);
    document.getElementById('app').classList.remove('is-booting');
    if (first && !S.route) onRoute();
  }).catch(e => { if (S && S.fromCache) { toast('No se pudieron actualizar los datos: ' + errMsg(e), 'error'); return; } bootError(e); });
}
action('app.retry', () => {
  const v = document.getElementById('view');
  if (v) { v.innerHTML = '<div class="py-20 text-center text-sm text-zinc-500 dark:text-zinc-400">' + icon('loader-circle', 'mx-auto mb-3 size-5 animate-spin') + 'Cargando…</div>'; refreshIcons(v); }
  loadApp();
});
function boot() {
  applyTheme(LS.get('theme', 'system'));
  // v3.4: sin zoom con gestos en iPhone (el meta viewport de doGet evita el zoom al escribir)
  ['gesturestart', 'gesturechange'].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));
  if (window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (LS.get('theme', 'system') === 'system') { applyTheme('system'); if (S) renderTopbar(); } });
  refreshIcons();
  // Links profundos (ej. el botón del correo → …/exec#/tareas): el iframe no ve el hash externo.
  const deepLink = new Promise(resolve => {
    try {
      if (window.google && google.script && google.script.url) {
        google.script.url.getLocation(loc => {
          const h = loc && loc.hash ? String(loc.hash).replace(/^#/, '') : '';
          if (h) location.hash = '#' + (h.charAt(0) === '/' ? h : '/' + h);
          resolve();
        });
        setTimeout(resolve, 1500);
        return;
      }
    } catch (e) {}
    resolve();
  });
  loadApp(deepLink);
  ptrInit();
  swipeInit();
  // Auto-actualización silenciosa cada 4 minutos si nadie está escribiendo
  setInterval(() => {
    const ae = document.activeElement;
    const typing = ae && /INPUT|TEXTAREA|SELECT/.test(ae.tagName);
    if (S && !document.hidden && !PENDING && !MODALS.length && !typing) refreshData(true);
  }, 4 * 60 * 1000);
  setInterval(() => { if (S && PENDING === 0) { const st = document.getElementById('sync-state'); if (st) { st.innerHTML = syncLabel(); refreshIcons(); } } }, 30000);
}
</script>
