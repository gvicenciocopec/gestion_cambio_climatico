  // Tema antes del primer pintado (localStorage puede fallar dentro del iframe de Apps Script)
  (function () {
    var p = 'system';
    try { p = JSON.parse(localStorage.getItem('aacc.theme')) || 'system'; } catch (e) {}
    var d = p === 'dark' || (p !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.classList.toggle('dark', d);
    document.documentElement.style.colorScheme = d ? 'dark' : 'light';
  })();
</script>
