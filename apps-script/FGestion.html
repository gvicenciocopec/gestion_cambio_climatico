<script>
/* =====================================================================
   FGestion · drawers, modales y widgets compartidos de Gestión

   de links, alta rápida con pickDate después de Enter y menos texto en pantalla (§14.4).
   v3.2 (SPEC §15): el compositor parte privado sin proyecto y compartido con proyecto (fgCmpAutoPriv, hasta que se

// Pila de navegación entre drawers (proyecto ⇄ tarea), guardados en curso por tarea (interruptores),

const FG_DIAS = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];
// Nombres cortos para los mini-chips de pilar del compositor (el nombre completo va en el title)
const FG_PIL_SHORT = { cc: 'Clima', ec: 'Circular', nat: 'Naturaleza' };

const FG_SOFT = {
  red: 'bg-red-50 text-red-700 dark:bg-red-500/10 dark:text-red-300',
  amber: 'bg-amber-50 text-amber-800 dark:bg-amber-500/10 dark:text-amber-300',
  emerald: 'bg-emerald-50 text-emerald-700 dark:bg-emerald-500/10 dark:text-emerald-300',
  indigo: 'bg-indigo-50 text-indigo-700 dark:bg-indigo-500/10 dark:text-indigo-300',

const FG_PILL = 'inline-flex h-7 min-w-0 max-w-full select-none items-center gap-1.5 rounded-full border px-2.5 text-xs font-medium transition active:scale-[.97] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500/60 disabled:cursor-not-allowed disabled:opacity-60';
const FG_PILL_OFF = 'border-zinc-200 bg-white text-zinc-600 hover:border-zinc-300 hover:text-zinc-900 aria-expanded:border-zinc-400 aria-expanded:text-zinc-900 dark:border-zinc-700 dark:bg-zinc-900 dark:text-zinc-300 dark:hover:border-zinc-600 dark:hover:text-white dark:aria-expanded:border-zinc-500 dark:aria-expanded:text-white';
const FG_PILL_ON = 'border-indigo-200 bg-indigo-50 text-indigo-700 hover:border-indigo-300 aria-expanded:border-indigo-400 dark:border-indigo-500/30 dark:bg-indigo-500/10 dark:text-indigo-300 dark:hover:border-indigo-400/50 dark:aria-expanded:border-indigo-400/70';
const FG_PILL_LATE = 'border-red-200 bg-red-50 text-red-700 hover:border-red-300 aria-expanded:border-red-400 dark:border-red-500/30 dark:bg-red-500/10 dark:text-red-300 dark:hover:border-red-400/50';
const FG_TABS = ['resumen', 'tareas', 'presupuesto', 'comentarios', 'drive'];
// Modo seguro: sin permiso de Drive no se muestra la pestaña ni la subida de evidencias a Drive
function fgDriveOn() { const f = S && S.config && S.config.features; return !f || !!f.drive; }
// Drive (SPEC §14.3): máximo por archivo (decodificado) y vigencia del listado en caché por proyecto
const FG_DRIVE_MAX = 20 * 1024 * 1024;
const FG_DRIVE_TTL = 3 * 60 * 1000;
// kind (driveList) → [ícono, tono]
const FG_DRIVE_KIND = {
  image: ['file-image', 'violet'], pdf: ['file-text', 'red'], doc: ['file-text', 'sky'], sheet: ['file-spreadsheet', 'emerald'],
  slide: ['presentation', 'amber'], folder: ['folder', 'zinc'], video: ['file-play', 'violet'], file: ['file', 'zinc'],
};
const FG_ESTADOS = [
  { value: 'Activo', tone: 'emerald', icon: 'circle-dot' },
  { value: 'En pausa', tone: 'amber', icon: 'hourglass' },
  { value: 'Cerrado', tone: 'zinc', icon: 'circle-check' },
];
const FG_LINE_ESTADO = {
  'Ejecutado': ['emerald', 'circle-check'],
  'En curso': ['sky', 'circle-dot'],
  'Por ejecutar': ['amber', 'clock'],
  'No se realizará': ['zinc', 'circle-x'],
};
const FG_EV_NAMES = {
  'file-spreadsheet': 'Planilla de Google',
  'file-text': 'Documento de Google',
  'presentation': 'Presentación de Google',
  'folder': 'Carpeta de Drive',
  'file': 'Archivo de Drive',
};
const FG_RED = 'rgb(239 68 68)';

/* ---------- Utilidades internas ---------- */
function fgUi() {
  S.ui = S.ui || {};
  S.ui.forms = S.ui.forms || {};
  if (!S.ui.forms.projectTab) S.ui.forms.projectTab = 'resumen';
  return S.ui.forms;
}
function fgReady() { return !!(S && IDX && IDX.project && IDX.task); }
function fgCmpStr(a, b) { return String(a || '').localeCompare(String(b || ''), 'es', { sensitivity: 'base' }); }
function fgByDue(a, b) {
  const x = a.fecha || '9999-12-31', y = b.fecha || '9999-12-31';
  return x < y ? -1 : x > y ? 1 : fgCmpStr(a.nombre, b.nombre);
}
function fgByDoneDesc(a, b) {
  const x = a.completada || '', y = b.completada || '';
  return x > y ? -1 : x < y ? 1 : fgCmpStr(a.nombre, b.nombre);
}
function fgClip(s, n) { s = String(s || ''); return s.length > n ? s.slice(0, n - 1) + '…' : s; }
function fgMuted(text) { return '<span class="text-zinc-400 dark:text-zinc-500">' + esc(text) + '</span>'; }
function fgFieldLabel(text) { return '<p class="' + CX.label + '">' + esc(text) + '</p>'; }
function fgSection(title, inner, count) {
  return '<section><h3 class="mb-2.5 flex items-center gap-2 text-[11px] font-semibold uppercase tracking-wider text-zinc-500 dark:text-zinc-400">' + esc(title) +
    (count ? '<span class="rounded-full bg-zinc-100 px-1.5 text-[10px] font-medium tabular-nums tracking-normal text-zinc-600 dark:bg-zinc-800 dark:text-zinc-300">' + count + '</span>' : '') + '</h3>' + inner + '</section>';
}
function fgLinkBtn(label, act, data, inline) {
  return '<button type="button" data-action="' + esc(act) + '"' + dataAttrs(data) + ' class="' + (inline ? '' : 'mt-2 ') + 'inline-flex items-center gap-1 rounded text-xs font-medium text-indigo-600 transition hover:text-indigo-500 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500/60 dark:text-indigo-400 dark:hover:text-indigo-300">' +
    esc(label) + icon('arrow-right', 'size-3 shrink-0') + '</button>';
}
// Botón con texto sólo desde sm (en móvil queda como ícono con aria-label).
function fgRBtn(o) {
  const cls = 'inline-flex h-9 select-none items-center justify-center gap-1.5 whitespace-nowrap rounded-lg px-2.5 text-sm font-medium transition active:scale-[.98] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500/60 sm:px-3.5 ' +
    (BTN_VARIANTS[o.variant] || BTN_VARIANTS.secondary) + ' ' + (o.cls || '');
  const t = o.title || o.label;
  return '<button type="button" class="' + cls + '" data-action="' + esc(o.action) + '"' + dataAttrs(o.data) + ' title="' + esc(t) + '" aria-label="' + esc(t) + '">' +
    icon(o.icon, 'size-4 shrink-0') + '<span class="hidden sm:inline">' + esc(o.label) + '</span></button>';
}
function fgModKey() { return /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent || '') ? '⌘' : 'Ctrl'; }
function fgSaveHint(verb) {
  return '<span class="mr-auto hidden items-center gap-1 text-xs text-zinc-400 sm:inline-flex dark:text-zinc-500"><kbd class="' + CX.kbd + '">' + fgModKey() + '</kbd><kbd class="' + CX.kbd + '">↵</kbd> para ' + esc(verb || 'guardar') + '</span>';
}
function fgPilarKey(k) { const p = k ? PIL(k) : null; return p ? p.key : ''; }
// v3 (SPEC §13.1): avisar por defecto true; privada por defecto false (bundles viejos sin el campo incluidos)
function fgAvisar(t) { return !!t && t.avisar !== false; }
function fgPrivada(t) { return !!t && t.privada === true; }
// Correo con el que el servidor identifica a quien mira ('' si Google no lo entregó)
function fgServerMe() { return S && S.me && S.me.email && S.me.email !== 'desconocido' ? S.me.email : ''; }
// Por qué no se puede cambiar la privacidad ('' = sí se puede): sin cuenta identificada, una tarea privada no la vería
// ni quien la crea (el servidor la rechaza); en una ajena, sólo quien la creó o su responsable (otro la perdería de vista).
const FG_MULTI_PUBLIC = 'Con varias personas, la tarea es del equipo (pública)';
function fgPrivacyBlock(t) {
  const me = fgServerMe();
  if (!me) return 'No pude identificar tu cuenta de Google: por ahora las tareas quedan compartidas';
  if (!t || !t.id) return '';
  if ((t.asignados || []).length) return FG_MULTI_PUBLIC;
  return !t.creadoPor || t.creadoPor === 'desconocido' || t.creadoPor === me || t.resp === me ? '' : 'Sólo quien la creó o su responsable pueden cambiarlo';
}
function fgCanPrivacy(t) { return !fgPrivacyBlock(t); }
// "y" → "e" antes de un sonido /i/ (tú e Ina, tú e Ignacio)
function fgAnd(a, b) { return a + (/^h?[iíÍI](?![aeouáéó])/i.test(String(b)) ? ' e ' : ' y ') + b; }
// Quién ve una tarea privada, contado desde quien mira
function fgWhoSees(t, priv, resp) {
  if (!priv) return 'Todo el equipo la ve en la app';
  const me = myEmail();
  const ppl = [(t && t.creadoPor && t.creadoPor !== 'desconocido') ? t.creadoPor : me, resp].filter(Boolean).filter((x, i, a) => a.indexOf(x) === i);
  const names = ppl.map(e => e === me ? 'tú' : userName(e)).sort((a, b) => (a === 'tú' ? -1 : b === 'tú' ? 1 : 0));
  if (!names.length || (names.length === 1 && names[0] === 'tú')) return 'Sólo tú la ves en la app';
  if (names.length === 1) return 'Sólo ' + names[0] + ' la ve en la app';
  return 'Sólo ' + fgAnd(names[0], names[1]) + ' la ven en la app';
}
function fgSoftChip(text, toneKey, iconName, title) {
  return '<span class="inline-flex min-w-0 items-center gap-1 whitespace-nowrap rounded-md px-1.5 py-0.5 font-medium ' + (FG_SOFT[toneKey] || FG_SOFT.zinc) + '"' +
    (title ? ' title="' + esc(title) + '"' : '') + '>' + (iconName ? icon(iconName, 'size-3 shrink-0') : '') + esc(text) + '</span>';
}
function fgPillarChip(k) {
  const p = PIL(k);
  if (!p) return '';
  return '<span class="inline-flex min-w-0 items-center gap-1 whitespace-nowrap rounded-md px-1.5 py-0.5 font-medium ' + p.tone.soft + '" title="' + esc(p.label) + '">' +
    icon(p.icon, 'size-3 shrink-0') + '<span class="truncate">' + esc(p.label) + '</span></span>';
}
// "Hoy" · "Mañana" · "Ayer" · "Vie 9 oct" (+ año si no es el actual)
function fgDayLabel(s) {
  const d = daysUntil(s);
  if (d === 0) return 'Hoy';
  if (d === 1) return 'Mañana';
  if (d === -1) return 'Ayer';
  const dt = parseYmd(s);
  if (!dt) return '';
  const wd = FG_DIAS[dt.getDay()];
  return wd.charAt(0).toUpperCase() + wd.slice(1) + ' ' + dt.getDate() + ' ' + MESES[dt.getMonth()] +
    (dt.getFullYear() !== new Date().getFullYear() ? ' ' + dt.getFullYear() : '');
}
// Próximo día de la semana (0 = domingo … 6 = sábado), siempre después de hoy
function fgNextDow(dow) {
  const n = new Date().getDay();
  return addDays(todayStr(), ((dow - n + 7) % 7) || 7);
}
// "1 oct → 31 dic 2026" · "Desde el 1 oct 2026" · "Hasta el 31 dic 2026"
function fgRange(a, b) {
  if (a && b) return (a.slice(0, 4) === b.slice(0, 4) ? fmtDateShort(a) : fmtDate(a)) + ' → ' + fmtDate(b);
  if (a) return 'Desde el ' + fmtDate(a);
  if (b) return 'Hasta el ' + fmtDate(b);
  return '';
}
function fgAutoGrow(ta) {
  if (!ta || ta.hidden) return;
  ta.style.height = 'auto';
  ta.style.height = Math.min(ta.scrollHeight + 2, 320) + 'px';
}
// Indicador que heredan las tareas nuevas del proyecto: sólo un indicador (no un grupo, que el servidor rechaza en tareas).
function fgProjCascade(p) {
  const c = p && p.cascade ? IDX.cascade.get(p.cascade) : null;
  return c && c.padre ? c.id : '';
}
// Pilar por defecto: el indicado → el del proyecto → el de la ruta actual → el primero.
function fgDefaultPilar(given, projId) {
  if (fgPilarKey(given)) return fgPilarKey(given);
  const p = projId ? IDX.project.get(projId) : null;
  if (p && fgPilarKey(p.pilar)) return fgPilarKey(p.pilar);
  const rp = S.route && S.route.params ? S.route.params.pilar : '';
  if (fgPilarKey(rp)) return fgPilarKey(rp);
  return (S.pillars[0] || {}).key || '';
}
function fgPillarBox(k, iconName, cls) {
  const p = PIL(k);
  return '<div class="grid ' + (cls || 'size-10') + ' shrink-0 place-items-center rounded-xl ring-1 ring-inset ring-black/5 dark:ring-white/5 ' + (p ? p.tone.iconbox : tone('zinc').iconbox) + '">' + icon(iconName, 'size-5') + '</div>';
}
function fgEstadoBadge(e) {
  const m = FG_ESTADOS.find(x => x.value === (e || 'Activo'));
  return m ? badge(m.value, m.tone, m.icon) : badge(e, 'zinc');
}
function fgLineEstadoBadge(e) {
  if (!e) return '';
  const m = FG_LINE_ESTADO[e];
  return badge(e, m ? m[0] : 'zinc', m ? m[1] : null);
}
function fgRelDays(s) {
  const d = daysUntil(s);
  if (d == null) return '';
  if (d === 0) return 'hoy';
  if (d === 1) return 'mañana';
  if (d === -1) return 'ayer';
  return d > 0 ? 'en ' + d + ' días' : 'hace ' + (-d) + ' días';
}
function fgWeekday(s) {
  const m = String(s || '').match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m ? FG_DIAS[new Date(+m[1], +m[2] - 1, +m[3]).getDay()] : '';
}
function fgWhen(iso) { const r = fmtRel(iso); return /^\d/.test(r) ? 'el ' + r : r; }
function fgCleanEv(list) {
  return (Array.isArray(list) ? list : [])
    .map(e => ({ t: String((e && e.t) || '').trim(), u: safeUrl(e && e.u) }))
    .filter(e => e.u)
    .map(e => ({ t: e.t || shortUrl(e.u), u: e.u }));
}
function fgBusy(b, on, label) {
  if (!b) return;
  if (on) {
    if (b.dataset.idle == null) b.dataset.idle = b.innerHTML;
    b.disabled = true;
    b.innerHTML = icon('loader-circle', 'size-4 shrink-0 animate-spin') + '<span>' + esc(label || 'Guardando…') + '</span>';
    refreshIcons(b);
  } else {
    if (b.dataset.idle != null) { b.innerHTML = b.dataset.idle; delete b.dataset.idle; }
    b.disabled = false;
  }
}
// Marca un campo como inválido (anillo rojo + mensaje). Siempre devuelve false.
function fgInvalid(input, msg) {
  if (!input) { toast(msg, 'error'); return false; }
  input.style.setProperty('--tw-ring-color', FG_RED);
  input.setAttribute('aria-invalid', 'true');
  let p = input.nextElementSibling;
  if (!p || !p.hasAttribute('data-fg-err')) {
    input.insertAdjacentHTML('afterend', '<p data-fg-err role="alert" class="mt-1 text-xs font-medium text-red-600 dark:text-red-400"></p>');
    p = input.nextElementSibling;
  }
  p.textContent = msg;
  input.focus();
  if (input.scrollIntoView) input.scrollIntoView({ block: 'nearest' });
  const clear = () => { fgClearInvalid(input); input.removeEventListener('input', clear); };
  input.addEventListener('input', clear);
  return false;
}
function fgClearInvalid(input) {
  input.style.removeProperty('--tw-ring-color');
  input.removeAttribute('aria-invalid');
  const p = input.nextElementSibling;
  if (p && p.hasAttribute('data-fg-err')) p.remove();
}
// Guardar con el botón [data-fg-save], ⌘/Ctrl+Enter o Enter en el campo "nombre".
function fgWireForm(el, save) {
  const b = el.querySelector('[data-fg-save]');
  const go2 = () => { if (b && !b.disabled) save(b); };
  if (b) b.addEventListener('click', go2);
  el.addEventListener('keydown', ev => {
    if (ev.key !== 'Enter' || ev.isComposing) return;
    const t = ev.target;
    if (ev.metaKey || ev.ctrlKey || (!ev.shiftKey && t && t.matches && t.matches('input[name="nombre"]'))) { ev.preventDefault(); go2(); }
  });
}

/* ---------- Navegación entre drawers (volver) ---------- */
function fgPushNav(key) {
  const st = FG_STATE.stack;
  const cur = currentDrawerKey();
  if (!cur || !/^(project|task):/.test(cur)) { st.length = 0; return null; }
  if (cur === key) return null;
  const top = st[st.length - 1];
  if (top && top.key === key) return st.pop();
  st.push({ key: cur, tab: cur.indexOf('project:') === 0 ? fgUi().projectTab : '' });
  if (st.length > 12) st.shift();
  return null;
}
function fgOpenEntry(e) {
  if (!e) return false;
  const i = e.key.indexOf(':'), type = e.key.slice(0, i), id = e.key.slice(i + 1);
  if (type === 'project' && IDX.project.get(id)) { openProject(id, { noHistory: true, tab: e.tab }); return true; }
  if (type === 'task' && IDX.task.get(id)) { openTask(id, { noHistory: true }); return true; }
  return false;
}
function fgBackBtn() {
  const prev = FG_STATE.stack[FG_STATE.stack.length - 1];
  if (!prev) return '';
  const i = prev.key.indexOf(':'), type = prev.key.slice(0, i), id = prev.key.slice(i + 1);
  const ent = type === 'project' ? IDX.project.get(id) : IDX.task.get(id);
  return iconBtn({ icon: 'arrow-left', action: 'project.back', title: 'Volver' + (ent ? ' a «' + fgClip(ent.nombre, 40) + '»' : ''), cls: '-ml-2' });
}
// Tras eliminar algo abierto: vuelve al drawer anterior si existe.
function fgAfterDelete() {
  while (FG_STATE.stack.length) { if (fgOpenEntry(FG_STATE.stack.pop())) return; }
}

/* =====================================================================
   taskRow(task, {showProject, showPillar, showCascade, showResp, lead, trail, attrs, cls}) → fila de lista
   v3.1 (§14.4): sólo título + vencimiento + avatar (+ candado si es privada). Proyecto / pilar / indicador
   sólo si quien llama lo pide (donde el contexto no lo dice ya). Check animado (checkButton de Core,
   acción task.toggle), data-task-row y título .task-title (tachado suave al completar).
   lead / trail / attrs: HTML extra (ya escapado por quien llama), p. ej. un asa para arrastrar.
   ===================================================================== */
function fgCheck(t, size) {
  if (typeof checkButton === 'function') return checkButton(t, { size: size || 'md', action: 'task.toggle' });
  // Respaldo si Core aún no trae checkButton
  const done = t.estado === 'Realizada';
  const lbl = done ? 'Marcar como pendiente' : 'Marcar como realizada';
  return '<button type="button" data-action="task.toggle" data-id="' + esc(t.id) + '" aria-pressed="' + done + '" title="' + lbl + '" aria-label="' + lbl + '" class="grid size-5 shrink-0 place-items-center rounded-full border-2 transition focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-emerald-500/50 ' +
    (done ? 'border-emerald-500 bg-emerald-500 text-white' : 'border-zinc-300 hover:border-emerald-500 dark:border-zinc-600') + '">' + (done ? icon('check', 'size-3 stroke-[3]') : '') + '</button>';
}
function fgDueChip(t) {
  const i = dueInfo(t);
  if (i.key === 'nodate' || i.key === 'done') return '';
  const tn = i.key === 'overdue' ? 'red' : (i.key === 'today' || i.key === 'soon') ? 'amber' : 'zinc';
  return fgSoftChip(i.label, tn, i.icon, fgWeekday(t.fecha) + ' ' + fmtDate(t.fecha));
}
function fgCascadeChip(id) {
  const it = IDX.cascade.get(id);
  if (!it) return '';
  const m = CLASE_META[it.clase] || CLASE_META.accion;
  const g = it.padre ? IDX.cascade.get(it.padre) : null;
  // El grupo se recorta primero: el indicador (lo específico) siempre queda visible.
  return '<span class="inline-flex min-w-0 max-w-[17rem] items-center gap-1 rounded-md bg-zinc-100 px-1.5 py-0.5 text-zinc-600 dark:bg-zinc-800 dark:text-zinc-300" title="' + esc(m.label + ' · ' + cascadeLabel(id)) + '">' +
    icon(m.icon, 'size-3 shrink-0 ' + tone(m.tone).text) +
    (g ? '<span class="min-w-0 max-w-[6.5rem] truncate text-zinc-400 dark:text-zinc-500">' + esc(g.nombre) + '</span><span class="shrink-0 text-zinc-400 dark:text-zinc-500" aria-hidden="true">›</span>' : '') +
    '<span class="min-w-0 truncate">' + esc(it.nombre) + '</span></span>';
}
function taskRow(t, opts) {
  if (!t) return '';
  opts = opts || {};
  const done = t.estado === 'Realizada';
  const meta = [];
  if (done) {
    meta.push('<span class="inline-flex items-center gap-1 text-emerald-700 dark:text-emerald-400">' + icon('check', 'size-3 shrink-0') +
      'Lista' + (t.completada ? ' el ' + esc(fmtDateShort(t.completada)) : '') + '</span>');
  } else {
    const dc = fgDueChip(t);
    if (dc) meta.push(dc);
  }
  // Sólo el avatar (su title lleva el nombre)
  if (opts.showResp !== false) meta.push('<span class="inline-flex items-center">' + avatarStack(taskPeople(t), 'xs', 3) + '</span>');
  if (opts.showProject && t.proyecto) {
    const p = IDX.project.get(t.proyecto);

function fgOpenLinkLines(id) {

  const pk = pil ? pil.key : p.pilar;

  const years = fgYearsAll().sort((a, b) => a === S.year ? -1 : b === S.year ? 1 : b - a);
  const rendered = [];

  });

    '<div class="max-h-[52vh] overflow-y-auto overscroll-contain rounded-xl border border-zinc-200 dark:border-zinc-800">' +
    (groups || emptyState({ icon: 'table', title: 'No hay líneas de ' + (pil ? pil.label : 'este pilar') })) +
    '<p data-link-empty hidden class="px-4 py-10 text-center text-sm text-zinc-500 dark:text-zinc-400">Sin resultados para esa búsqueda.</p></div></div>';
  openModal({
    size: 'lg',
    title: 'Vincular líneas de presupuesto',
    subtitle: esc(p.nombre),
    iconHtml: fgPillarBox(p.pilar, 'link'),
    body: body,
    footer: '<span data-link-sum class="mr-auto text-xs tabular-nums text-zinc-500 dark:text-zinc-400"></span>' +
      btn({ label: 'Cancelar', variant: 'secondary', action: 'modal.close' }) +
      btn({ label: 'Guardar vínculos', icon: 'check', variant: 'primary', attrs: 'data-fg-save' + (groups ? '' : ' disabled') }),
    onMount: (el, close) => {
      const sumEl = el.querySelector('[data-link-sum]');
      const sum = () => {
        const boxes = Array.prototype.slice.call(el.querySelectorAll('input[name="lineas"]:checked'));
        const tot = boxes.reduce((a, b) => a + (Number(b.dataset.pf) || 0), 0);
        sumEl.textContent = plural(boxes.length, 'línea seleccionada', 'líneas seleccionadas') + (boxes.length ? ' · ' + fmtMoney(tot) : '');
      };
      sum();
      el.addEventListener('change', ev => { if (ev.target && ev.target.name === 'lineas') sum(); });
      fgWireForm(el, b => {
        const cur = IDX.project.get(p.id);
        if (!cur) { toast('El proyecto ya no existe', 'error'); close(); return; }
        const sel = Array.prototype.slice.call(el.querySelectorAll('input[name="lineas"]:checked')).map(x => x.value);
        // Se conservan vínculos que no se mostraron (otro pilar) si la línea aún existe.
        const keep = (cur.lineas || []).filter(x => rendered.indexOf(x) < 0 && IDX.line.has(x));
        fgUi().projectTab = 'presupuesto';
        // v3.4 (SPEC §18): se ve al tiro; el servidor confirma por detrás
        const pay = fgProjectPayload(cur, { lineas: keep.concat(sel) });
        close();
        optimistic(() => { const x = IDX.project.get(p.id); if (x) x.lineas = pay.lineas.slice(); }, 'gSave', [pay], { reapply: true });
        toast('Líneas vinculadas actualizadas', 'success');
      });
    },
  });
}
// v3.4 (SPEC §18): sin control de versión (base): se prefiere la agilidad y el último cambio gana.
function fgProjectPayload(p, over) {
  const o = Object.assign({
    tipo: 'Proyecto',
    id: p.id || '',
    pilar: fgPilarKey(p.pilar) || p.pilar || '',
    nombre: p.nombre || '',
    detalle: p.detalle || '',
    resp: p.resp || '',
    estado: p.estado || 'Activo',
    anio: p.anio ? String(p.anio) : '',
    lineas: (p.lineas || []).slice(),
    cascade: p.cascade || '',
    evidencias: fgCleanEv(p.evidencias),
    inicio: p.inicio || '',
    fin: p.fin || '',
  }, over || {});
  o.lineas = (o.lineas || []).filter(x => typeof x === 'string' && x).filter((x, i, a) => a.indexOf(x) === i);
  delete o.base;
  if (!o.id) delete o.id;
  return o;
}

function fgYearOptions(cur) {
  const ys = fgYearsAll();
  if (!ys.length) ys.push(new Date().getFullYear());
  const max = Math.max.apply(null, ys);
  if (ys.indexOf(max + 1) < 0) ys.push(max + 1);
  if (cur && /^\d{4}$/.test(String(cur)) && ys.indexOf(Number(cur)) < 0) ys.push(Number(cur));
  ys.sort((a, b) => a - b);
  return [{ value: '', label: 'Todos los años' }].concat(ys.map(y => ({ value: String(y), label: String(y) })));
}

    selectField({ name: 'anio', label: 'Año', value: p ? String(p.anio || '') : String(S.year || ''), options: fgYearOptions(p && p.anio) }) +
    // Plazo opcional: alimenta la planificación (carta Gantt) del pilar
    field({ name: 'inicio', label: 'Inicio (opcional)', type: 'date', value: p ? (p.inicio || '') : '' }) +
    field({ name: 'fin', label: 'Término (opcional)', type: 'date', value: p ? (p.fin || '') : '' }) +

    field({ name: 'detalle', label: 'Descripción (opcional)', type: 'textarea', rows: 3, value: p ? p.detalle : '', placeholder: '¿De qué se trata? Objetivo, alcance, acuerdos, links…', cls: 'sm:col-span-2', attrs: 'maxlength="8000"' }) +
    // Al editar se pueden subir archivos a la carpeta del proyecto (Drive) y quedan como links

    onMount: (el, close) => {
      fgWireForm(el, b => {
        const f = readForm(el);
        const nombre = String(f.nombre || '').trim();
        if (!nombre) { fgInvalid(el.querySelector('[name="nombre"]'), 'Ponle un nombre al proyecto'); return; }
        const okDate = v => !v || /^\d{4}-\d{2}-\d{2}$/.test(v);
        if (!okDate(f.inicio)) { fgInvalid(el.querySelector('[name="inicio"]'), 'Fecha no válida'); return; }
        if (!okDate(f.fin)) { fgInvalid(el.querySelector('[name="fin"]'), 'Fecha no válida'); return; }
        if (f.inicio && f.fin && f.fin < f.inicio) { fgInvalid(el.querySelector('[name="fin"]'), 'El término va después del inicio'); return; }
        if (!fgCheckEvidence(el, 'evidencias')) return;
        const cur = p ? (IDX.project.get(p.id) || p) : {};
        const pil = lock ? cur.pilar : f.pilar;
        const over = {
          pilar: pil, nombre: nombre, detalle: f.detalle || '', resp: f.resp || '', estado: f.estado || 'Activo',
          anio: f.anio || '', cascade: f.cascade || '', evidencias: readEvidence(el, 'evidencias'),
          inicio: f.inicio || '', fin: f.fin || '',
        };
        if (p) {
          // v3.4 (SPEC §18): al editar, la pantalla cambia al tiro y el servidor confirma por detrás
          const pay = fgProjectPayload(cur, over);
          close();
          optimistic(() => { const x = IDX.project.get(p.id); if (x) Object.assign(x, over); }, 'gSave', [pay], { reapply: true });
          toast('Proyecto actualizado', 'success');
          return;
        }
        // Al crear se espera el id del servidor (luego se abre el proyecto nuevo)
        const okLines = pre.filter(l => l.pilar === fgPilarKey(pil) && !IDX.lineProject.get(l.id));
        over.lineas = okLines.map(l => l.id);
        fgBusy(b, true);
        mutate('gSave', [fgProjectPayload(cur, over)], { success: 'Proyecto creado' }).then(r => {
          if (!r) { fgBusy(b, false); return; }
          close();
          if (okLines.length < pre.length) toast(plural(pre.length - okLines.length, 'línea no se vinculó', 'líneas no se vincularon') + ' por ser de otro pilar', 'info');
          if (r.lastId && IDX.project.get(r.lastId)) openProject(r.lastId, okLines.length ? { tab: 'presupuesto' } : null);
        });
      });
    },
  });
}

/* =====================================================================
   "¿Cómo te fue?" · comentario de cierre OPCIONAL (SPEC §13.1)
   Pendiente → taskComplete(id, {cierre, completada, evidencias}) (cierre puede ir vacío).
   Ya lista (p. ej. desde el toast "Agregar comentario") → gSave con cierre / evidencias (sólo lo que cambió).
   ===================================================================== */
function openCompleteTask(id) {
  if (!fgReady()) return;
  const t = IDX.task.get(id);
  if (!t) { toast('No se encontró la tarea', 'error'); return; }
  const done = t.estado === 'Realizada';
  const today = todayStr();
  const evs = done ? fgCleanEv(t.evidencias) : [];
  const body = '<div class="space-y-3">' +
    '<textarea id="fg-cierre-' + esc(id) + '" name="cierre" rows="3" maxlength="4000" aria-label="Comentario de cierre (opcional)" placeholder="Opcional: qué se hizo o dónde quedó…" class="' + CX.input + ' resize-y">' + esc(done ? (t.cierre || '') : '') + '</textarea>' +
    '<div class="flex flex-wrap items-center gap-x-4 gap-y-2">' +
    '<label class="inline-flex items-center gap-2 text-xs font-medium text-zinc-600 dark:text-zinc-300">' + icon('calendar-check', 'size-3.5 shrink-0 text-zinc-400') + 'Lista el' +
    '<input type="date" name="completada" value="' + esc(done ? (t.completada || today) : today) + '" max="' + today + '" aria-label="Fecha en que quedó lista" class="' + FG_MINI_INPUT + '"></label>' +
    '<button type="button" data-action="task.links" aria-expanded="' + (evs.length > 0) + '" class="inline-flex items-center gap-1.5 rounded text-xs font-medium text-indigo-600 transition hover:text-indigo-500 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500/60 dark:text-indigo-400 dark:hover:text-indigo-300">' +
    icon('paperclip', 'size-3.5 shrink-0') + (evs.length ? 'Links (' + evs.length + ')' : 'Agregar links') + '</button></div>' +
    '<div data-fg-links' + (evs.length ? '' : ' hidden') + '>' + evidenceEditorHtml('evidencias', evs, { project: t.proyecto && IDX.project.get(t.proyecto) ? t.proyecto : '' }) + '</div>' +
    '</div>';
  openModal({
    size: 'md',
    title: '¿Cómo te fue?',
    subtitle: esc(t.nombre),
    iconHtml: '<div class="grid size-10 shrink-0 place-items-center rounded-full bg-emerald-100 text-emerald-600 dark:bg-emerald-500/15 dark:text-emerald-400">' + icon(done ? 'message-square-text' : 'party-popper', 'size-5') + '</div>',
    body: body,
    footer: fgSaveHint() + btn({ label: 'Cancelar', variant: 'ghost', action: 'modal.close' }) +
      btn({ label: done ? 'Guardar' : 'Marcar como lista', icon: 'check', variant: 'success', attrs: 'data-fg-save' }),
    onMount: (el, close) => {
      fgWireForm(el, b => {
        const cur = IDX.task.get(id);
        if (!cur) { toast('La tarea ya no existe', 'error'); close(); return; }
        const ta = el.querySelector('[name="cierre"]');
        const di = el.querySelector('[name="completada"]');
        const cierre = String(ta.value || '').trim();
        const comp = String(di.value || '').trim() || todayStr();
        if (!/^\d{4}-\d{2}-\d{2}$/.test(comp)) { fgInvalid(di, 'Fecha no válida'); return; }
        if (comp > todayStr()) { fgInvalid(di, 'La fecha no puede ser futura'); return; }
        if (!fgCheckEvidence(el, 'evidencias')) {
          const box = el.querySelector('[data-fg-links]');
          if (box) box.hidden = false;
          return;
        }
        const evList = readEvidence(el, 'evidencias');
        // v3.4 (SPEC §18): se cierra al tiro y la tarea cambia en pantalla; el servidor confirma por detrás
        if (cur.estado !== 'Realizada') {
          const done = { estado: 'Realizada', completada: comp, cierre: cierre, evidencias: evList };
          close();
          optimistic(() => { const x = IDX.task.get(id); if (x) fgApplyTask(x, done); }, 'taskComplete', [id, { cierre: cierre, completada: comp, evidencias: evList }], { reapply: true });
          toast('¡Lista! Una menos', 'success');
          return;
        }
        // Ya estaba lista: sólo se guarda lo que cambió
        const over = { cierre: cierre, evidencias: evList };
        if (comp !== (cur.completada || '')) over.completada = comp;
        if (cierre === (cur.cierre || '') && !over.completada && JSON.stringify(evList) === JSON.stringify(fgCleanEv(cur.evidencias))) { close(); return; }
        close();
        optimistic(() => { const x = IDX.task.get(id); if (x) fgApplyTask(x, over); }, 'gSave', [Object.assign({ tipo: 'Tarea', id: id }, over)], { reapply: true });
        toast(cierre ? 'Comentario guardado' : 'Cambios guardados', 'success');
      });
    },
  });
}

function fgCpkRoot(el) { return el && el.closest ? el.closest('[data-cpk]') : null; }
function fgCpkSetOpen(root, open) {

function fgCpkSet(root, val) {

function fgCpkFilter(root, q) {
  const terms = normTxt(q).split(/\s+/).filter(Boolean);
  const vis = {};
  const pil = {};
  let shown = 0;
  root.querySelectorAll('[data-cpk-opt]').forEach(o => {
    if (o.hasAttribute('data-cpk-none')) { o.hidden = terms.length > 0; return; }
    const ok = terms.every(t => (o.dataset.q || '').indexOf(t) >= 0);
    o.hidden = !ok;
    if (ok) { shown++; vis[o.dataset.group] = 1; }
  });
  root.querySelectorAll('[data-cpk-group]').forEach(g => {
    const on = !!vis[g.dataset.cpkGroup];
    g.hidden = !on;
    if (on) pil[g.dataset.pillar] = 1;
  });
  root.querySelectorAll('[data-cpk-pillar]').forEach(h => { h.hidden = !pil[h.dataset.cpkPillar]; });

// Teclado del panel: ↑/↓ entre opciones, Enter en la búsqueda elige la primera, Esc cierra el panel (no el modal).
function fgCpkWire(root) {
  if (root.dataset.wired) return;
  root.dataset.wired = '1';
  root.addEventListener('keydown', ev => {
    const panel = root.querySelector('[data-cpk-panel]');
    if (!panel || panel.hidden) return;
    const k = ev.key;
    if (k === 'Escape') {
      ev.preventDefault(); ev.stopPropagation();
      fgCpkSetOpen(root, false);
      const tr = root.querySelector('[data-cpk-trigger]'); if (tr) tr.focus();
      return;
    }
    if (k !== 'ArrowDown' && k !== 'ArrowUp' && k !== 'Enter') return;
    const opts = Array.prototype.slice.call(root.querySelectorAll('[data-cpk-opt]')).filter(o => !o.hidden);
    const inSearch = ev.target && ev.target.hasAttribute && ev.target.hasAttribute('data-cpk-search');
    if (k === 'Enter') {
      if (!inSearch) return;
      ev.preventDefault(); ev.stopPropagation();
      const first = opts.find(o => o.dataset.value) || opts[0];
      if (first && ev.target.value.trim()) first.click();
      return;
    }
    ev.preventDefault();
    const i = opts.indexOf(document.activeElement);
    const n = k === 'ArrowDown' ? i + 1 : i - 1;
    if (n < 0) { const s = root.querySelector('[data-cpk-search]'); if (s) s.focus(); return; }
    const target = opts[Math.min(n, opts.length - 1)];
    if (target) { target.focus(); if (target.scrollIntoView) target.scrollIntoView({ block: 'nearest' }); }
  });
}
// Re-dibuja el selector con otro pilar (conserva el valor sólo si es del nuevo pilar).

  const root = scope.querySelector('[data-cpk][data-name="' + name + '"]');

  const keep = it && it.pilar === pk ? it.id : '';
  const h = root.querySelector('[data-cpk-hint]');
  root.outerHTML = cascadePickerHtml({ name: name, pilar: pk, value: keep, hint: h ? h.textContent : '' });
}

    if (!hasFiles(ev) || !document.querySelector('[data-fg-drop]')) return;

  const tmp = Object.assign({ id: 'tmp-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), creadoPor: myEmail() }, payload);
  FG_STATE.qa.push(tmp);
  const key = 'project:' + pid;
  if (currentDrawerKey() === key) refreshDrawer();
  const again = document.getElementById('fg-qa-' + pid);
  if (again) again.focus();
  return mutate('gSave', [payload], { silent: true }).then(b => {
    FG_STATE.qa = FG_STATE.qa.filter(x => x !== tmp);
    if (currentDrawerKey() === key) refreshDrawer();
    // Si falló, el texto vuelve al campo para reintentar (si no se escribió otra cosa)
    if (!b) { const i = document.getElementById('fg-qa-' + pid); if (i && !i.value.trim()) i.value = typed; }
    return b;
  });
}

action('task.toggle', (d, el) => {
  const t = IDX.task.get(d.id);
  // Una fila optimista (id temporal 'tmp-…' de la lista personal) aún no existe en el servidor
  if (!t || /^tmp-/.test(String(t.id))) return;
  // Un toque a la vez: la animación dura ~0,5 s y luego se guarda (v3.4: sólo se ignora el doble toque)
  const now = Date.now(), last = FG_STATE.tapAt[t.id] || 0;
  if (now - last < 700) return;
  FG_STATE.tapAt[t.id] = now;
  if (t.estado === 'Realizada') {
    if (typeof reopenTask === 'function') reopenTask(t.id);
    else mutate('taskReopen', [t.id], { success: 'Tarea reabierta' });
  } else if (typeof completeTask === 'function') {
    completeTask(t.id, el);
  } else {
    openCompleteTask(t.id);
  }
});

  const t = IDX.task.get(d.id);
  if (!t || t.estado !== 'Realizada') return;

  else mutate('taskReopen', [t.id], { success: 'Tarea reabierta' });
});
// Interruptores del drawer: Avisarme (alterna) y Compartida / Privada (data-value 0|1). Cambio al instante (v3.4: sin base).
action('task.flag', (d, el) => {
  const t = IDX.task.get(d.id);
  if (!t || FG_STATE.busy[t.id]) return;
  const key = d.key === 'privada' ? 'privada' : 'avisar';
  if (key === 'privada' && !fgCanPrivacy(t)) { toast(fgPrivacyBlock(t), 'info'); return; }
  const cur = key === 'privada' ? fgPrivada(t) : fgAvisar(t);
  const val = d.value === '1' ? true : d.value === '0' ? false : !cur;
  if (val === cur) return;
  const payload = { tipo: 'Tarea', id: t.id };
  payload[key] = val;
  const msg = key === 'avisar' ? (val ? 'Aviso por correo activado' : 'Listo, sin aviso por correo') : (val ? 'Ahora es privada' : 'Ahora la ve todo el equipo');
  FG_STATE.busy[t.id] = 1;
  // El interruptor se mueve al tiro; el cambio se aplica un instante después (deja ver la animación)
  const sw = el && el.querySelector ? el.querySelector('[data-fg-switch]') : null;
  if (sw) sw.dataset.on = val ? 'true' : 'false';
  if (el && el.getAttribute('role') === 'switch') el.setAttribute('aria-checked', String(val));
  setTimeout(() => {
    const p = typeof optimistic === 'function'
      ? optimistic(() => { const x = IDX.task.get(t.id); if (x) x[key] = val; }, 'gSave', [payload], { success: msg, reapply: true })
      : mutate('gSave', [payload], { success: msg });
    Promise.resolve(p).then(() => { delete FG_STATE.busy[t.id]; }, () => { delete FG_STATE.busy[t.id]; });
  }, sw ? 160 : 0);
});

function fgCmpPpl(el, change, email) {
  const r = fgCmpRoot(el);
  if (!r) return;
  const cur = fgCmpGet(r);
  const st = change({ resp: cur.resp, asignados: cur.asignados.slice() });

  fgCmpSet(r, patch);
  const box = r.querySelector('[data-fg-pop]');
  if (box && r.dataset.pop === 'resp') {
    box.innerHTML = '<div>' + fgCmpPopResp(fgCmpGet(r)) + '</div>';
    refreshIcons(box);
    const again = box.querySelector('[data-action="task.cmp.ppl"][data-value="' + (window.CSS && CSS.escape ? CSS.escape(email) : email) + '"]');
    if (again) again.focus({ preventScroll: true });
  }
}

function fgOpenCatalog(pk, casId) {
  const c = casId && IDX.cascade ? IDX.cascade.get(casId) : null;
  if ((c || pk) && typeof admState === 'function') {
    const A = admState();
    A.pilar = c ? c.pilar : pk;
    A.casQ = '';
    if (c) A.open[c.padre || c.id] = true;

  go('#/cascade');
  if (c && c.padre && typeof openCascadeItem === 'function') openCascadeItem(c.id);
}

  const casId = inp ? inp.value : '';
  const leave = () => {
    for (let i = 0; i < 10 && MODALS.length; i++) closeTopModal();

    fgOpenCatalog(pk, casId);

  if (!el.closest('[data-modal-body]')) { leave(); return; }
